<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GingerBooks</title><meta name="theme-color" content="#0f766e">
<style>
:root{--g:#0f766e;--gd:#115e59;--bg:#f4f8ef;--card:#fff;--line:#dce8dd;--txt:#1b2b25;--mut:#5b6e64;--red:#c0392b;--amb:#b7791f;--grn:#3d8b1f;--y:#f2c230;--leaf:#7cb342;--soft:#eef6e8}
*{box-sizing:border-box}
a{color:var(--g)}
#modal{position:fixed;inset:0;background:rgba(10,40,36,.45);display:none;align-items:flex-start;justify-content:center;z-index:8;padding:5vh 12px;overflow:auto}.mbox{background:#fff;border-radius:14px;padding:16px 18px;width:100%;max-width:720px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.attrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.attth{width:54px;height:54px;object-fit:cover;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.link{cursor:pointer;transition:border-color .15s,box-shadow .15s}.link:hover{border-color:var(--g);box-shadow:0 2px 8px rgba(15,118,110,.15)}.more{float:right;font-size:12.5px;font-weight:500;color:var(--g);cursor:pointer;text-decoration:none}.more:hover{text-decoration:underline}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;min-height:100vh}
#nav{width:225px;background:linear-gradient(180deg,#0b3b37 0%,#0f4f47 60%,#1d5e3a 100%);color:#e6f2ec;padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
#nav .brand{font-weight:700;font-size:17px;padding:6px 10px 2px;color:var(--y)}
#nav .biz{font-size:12px;padding:0 10px 12px;color:#a9c9bd}
#nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;user-select:none}
#nav a:hover{background:rgba(255,255,255,.09)}#nav a.on{background:linear-gradient(90deg,var(--leaf),#4f9a3a);color:#fff;box-shadow:inset 3px 0 0 var(--y)}
#nav .sep{border-top:1px solid rgba(255,255,255,.14);margin:8px 4px}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
main{flex:1;padding:20px 26px;max-width:1280px;min-width:0}
h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{color:var(--mut);font-size:13px}.kpi .s{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mut);font-weight:600;background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap}
.btn{display:inline-block;border:1px solid var(--g);background:var(--g);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;margin:2px;font-family:inherit}
.btn:hover{filter:brightness(.95)}.btn.o{background:#fff;color:var(--gd)}.btn.s{padding:4px 9px;font-size:13px}.btn.r{background:var(--red);border-color:var(--red);color:#fff}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid #c7d8cb;border-radius:7px;background:#fff;width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.f{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:8px}
.lines td{padding:4px;border-bottom:none}.lines input,.lines select{padding:6px}
.tot{margin-left:auto;max-width:360px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:19px;font-weight:700;border-top:2px solid var(--txt);margin-top:4px;padding-top:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eee;white-space:nowrap}
.pill.red{background:#fadbd8;color:var(--red)}.pill.amber{background:#fdebd0;color:#9c640c}.pill.green{background:#d5f5e3;color:var(--grn)}.pill.grey{background:#eee;color:#555}
.alert{padding:9px 12px;border-left:4px solid;border-radius:6px;margin:6px 0;background:#fff;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alert.red{border-left-color:var(--red)}.alert.amber{border-left-color:var(--amb)}.alert.grey{border-left-color:#999}
.alert b{min-width:130px}
.mut{color:var(--mut)}.up{color:var(--grn)}.dn{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:6px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;background:#fff}
.tabs a.on{background:var(--g);color:#fff;border-color:var(--g)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
#toast{position:fixed;bottom:20px;right:20px;background:#0b3b37;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:420px}
.banner{background:#fdebd0;border:1px solid #f5cba7;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.banner.red{background:#fadbd8;border-color:#f1948a}
.scroll{overflow-x:auto}
.bar{fill:var(--g)}.bar:hover{fill:var(--gd)}
.hbar{height:8px;background:#f3e3cf;border-radius:4px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--g)}
#print{display:none}
@media print{#app,#toast,#modal{display:none!important}#print{display:block}body{background:#fff}}
@media(max-width:820px){#app{flex-direction:column}#nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap}#nav .brand,#nav .biz{width:100%}#nav .sep{display:none}main{padding:12px}}
.inv{font:11px/1.35 Arial,Helvetica,sans-serif;color:#000}
.inv table{border-collapse:collapse;width:100%}
.inv td,.inv th{border:1px solid #000;padding:3px 5px;background:none;color:#000;font-size:10.5px}
.inv th{font-weight:bold;text-align:center}
.inv .t{font-size:16px;font-weight:bold;text-align:center;letter-spacing:1px}
.inv .nb td{border:none}
.inv .n{text-align:right}
@page{size:A4;margin:10mm}
</style>
</head>
<body>
<div id="app"><aside id="nav"></aside><main id="main">Loading…</main></div>
<div id="print"></div>
<div id="toast"></div><div id="modal" onclick="if(event.target===this)attClose()"></div>

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+(+n||0));return ymd(x)}
const dmy=d=>d?d.slice(8,10)+'-'+d.slice(5,7)+'-'+d.slice(0,4):'';
const r2=n=>Math.round(((+n||0)+Number.EPSILON)*100)/100;
const r3=n=>Math.round(((+n||0)+Number.EPSILON)*1000)/1000;
const f2=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>(+n<0?'−₹'+f2(-n):'₹'+f2(n));
const money0=n=>{const v=Math.round(+n||0);return (v<0?'−₹':'₹')+Math.abs(v).toLocaleString('en-IN')};
const qf=n=>(+n||0).toLocaleString('en-IN',{maximumFractionDigits:3});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fy(date){const y=+date.slice(0,4),m=+date.slice(5,7);const s=m>=4?y:y-1;return s+'-'+pad((s+1)%100)}
function fyStart(date){const y=+date.slice(0,4),m=+date.slice(5,7);return (m>=4?y:y-1)+'-04-01'}
function nextNo(prefix,date){const k=prefix+'/'+fy(date);S.counters[k]=(S.counters[k]||0)+1;return k+'/'+String(S.counters[k]).padStart(4,'0')}
function gstinValid(g){if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return false;return gstinCheck(g.slice(0,14))===g[14]}
function gstinCheck(p){const cs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';let sum=0;for(let i=0;i<14;i++){const v=cs.indexOf(p[i])*(i%2?2:1);sum+=Math.floor(v/36)+v%36}return cs[(36-sum%36)%36]}
function words(n){const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+two(x%100);
 let r='';const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1000);n%=1000;
 if(cr)r+=three(cr)+' Crore ';if(l)r+=two(l)+' Lakh ';if(th)r+=two(th)+' Thousand ';if(n)r+=three(n);return r.trim()||'Zero'}
function amountWords(x){x=Math.abs(+x||0);const rs=Math.floor(x),p=Math.round((x-rs)*100);return 'Rupees '+words(rs)+(p?' and '+words(p)+' Paise':'')+' Only'}
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms||2600)}
function filt(inp,tid){const q=inp.value.toLowerCase();document.querySelectorAll('#'+tid+' tr').forEach((tr,i)=>{if(i)tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}
function download(fn,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function csvText(h,rows){const q=v=>{v=v==null?'':String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [h,...rows].map(r=>r.map(q).join(',')).join('\r\n')}
function csv(name,h,rows){download(name.replace(/[^\w\-]+/g,'_')+'.csv','\ufeff'+csvText(h,rows),'text/csv;charset=utf-8')}

/* ---------- storage ---------- */
const DBNAME='gingerbooks',STORE='kv';
let S=null,FH=null,AUTO_NEEDS=false;
function blank(){return{version:1,settings:{name:'',address:'',gstin:'',state:'',phone:'',email:'',bank:'',fssai:'',terms:'Goods once sold are taken back only as per our return policy. Subject to local jurisdiction.',expiryWarnDays:30,b2clLimit:100000,backupDays:7,monthTarget:0,elecRate:8,logo:DEFAULT_LOGO},
 items:[],customers:[],suppliers:[],batches:[],moves:[],purchases:[],sales:[],salesReturns:[],purchaseReturns:[],orders:[],production:[],adjustments:[],receipts:[],expenses:[],bankTxns:[],vendors:[],workers:[],attachments:[],counters:{},lastBackup:null,created:today()}}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function persist(){const data=JSON.stringify(S);if(typeof syncAfterCommit==='function'&&syncOn())syncAfterCommit();try{await idbPut('state',data)}catch(e){try{localStorage.setItem(DBNAME,data)}catch(e2){toast('Could not save! Download a backup now.',8000)}}
 clearTimeout(persist.t);persist.t=setTimeout(writeFH,1500)}
function commit(msg){persist();render();if(msg)toast(msg)}
async function writeFH(){if(!FH)return;try{if((await FH.queryPermission({mode:'readwrite'}))!=='granted'){AUTO_NEEDS=true;return}
 const w=await FH.createWritable();await w.write(JSON.stringify(S,null,0));await w.close();AUTO_NEEDS=false;localStorage.setItem(DBNAME+'-auto',new Date().toISOString())}catch(e){AUTO_NEEDS=true}}
async function pickBackupFile(){try{FH=await window.showSaveFilePicker({suggestedName:'GingerBooks-autobackup.json',types:[{description:'GingerBooks backup',accept:{'application/json':['.json']}}]});await idbPut('fh',FH);await writeFH();render();toast('Auto-backup is ON. Every change is copied to that file.')}catch(e){}}
async function reconnectFH(){try{if(FH&&(await FH.requestPermission({mode:'readwrite'}))==='granted'){await writeFH();render();toast('Auto-backup reconnected')}}catch(e){}}
async function stopAuto(){FH=null;await idbPut('fh',null);render()}

/* ---------- stock engine ---------- */
let STK=null;
function stock(){if(STK)return STK;const b={},it={};for(const m of S.moves){if(m.batchId)b[m.batchId]=r3((b[m.batchId]||0)+m.qty);it[m.itemId]=r3((it[m.itemId]||0)+m.qty)}return STK={b,it}}
function addMove(itemId,batchId,qty,type,refId,date){S.moves.push({id:uid(),itemId,batchId:batchId||null,qty:r3(qty),type,refId,date});STK=null}
function removeMoves(refId){S.moves=S.moves.filter(m=>m.refId!==refId);STK=null}
function getBatch(itemId,no,mfg,exp,cost){no=(no||'').trim()||autoBatch(mfg||today());let b=S.batches.find(x=>x.itemId===itemId&&x.no.toLowerCase()===no.toLowerCase());
 if(!b){b={id:uid(),itemId,no,mfg:mfg||'',exp:exp||'',cost:+cost||0,closed:false};S.batches.push(b)}else{if(exp&&!b.exp)b.exp=exp;if(mfg&&!b.mfg)b.mfg=mfg;if(cost&&!b.cost)b.cost=+cost;b.closed=false}return b}
const autoBatch=d=>'B'+d.slice(2,4)+d.slice(5,7)+d.slice(8,10);
function available(itemId){const st=stock(),t=today();return r3(S.batches.filter(b=>b.itemId===itemId&&(!b.exp||b.exp>=t)).reduce((s,b)=>s+Math.max(0,st.b[b.id]||0),0))}
function allocate(itemId,qty,simB){const t=today();const bs=S.batches.filter(b=>b.itemId===itemId&&(!b.exp||b.exp>=t)&&(simB[b.id]||0)>0).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||a.no.localeCompare(b.no));
 const out=[];let rem=r3(qty);for(const b of bs){if(rem<=0)break;const take=Math.min(rem,simB[b.id]);out.push({batchId:b.id,qty:r3(take)});simB[b.id]=r3(simB[b.id]-take);rem=r3(rem-take)}
 if(rem>0)out.push({batchId:null,qty:rem,short:true});return out}
function batchText(alloc){return alloc.map(a=>{const b=byId(S.batches,a.batchId);return b?b.no+(b.exp?' (exp '+dmy(b.exp)+')':'')+(alloc.length>1?' × '+qf(a.qty):''):'no stock'+(alloc.length>1?' × '+qf(a.qty):'')}).join(', ')}
function itemCost(itemId){const it=byId(S.items,itemId);return +(it&&it.cost)||0}
function stockValue(){const st=stock();let v=0;for(const b of S.batches){const q=st.b[b.id]||0;if(q>0)v+=q*(b.cost||itemCost(b.itemId))}return v}

/* ---------- tax ---------- */
function calcLines(lines,inter){const t={taxable:0,cgst:0,sgst:0,igst:0};
 for(const l of lines){const it=byId(S.items,l.itemId);if(it){l.name=l.name||it.name;l.hsn=l.hsn||it.hsn||'';l.unit=l.unit||it.unit||''}
  l.taxable=r2((+l.qty||0)*(+l.rate||0)*(1-(+l.disc||0)/100));const tax=r2(l.taxable*(+l.gst||0)/100);
  if(inter){l.igst=tax;l.cgst=0;l.sgst=0}else{l.cgst=r2(tax/2);l.sgst=r2(tax-l.cgst);l.igst=0}
  l.total=r2(l.taxable+tax);t.taxable+=l.taxable;t.cgst+=l.cgst;t.sgst+=l.sgst;t.igst+=l.igst}
 for(const k in t)t[k]=r2(t[k]);t.gross=r2(t.taxable+t.cgst+t.sgst+t.igst);t.total=Math.round(t.gross);t.roundOff=r2(t.total-t.gross);return t}
function partyOf(coll,id,fallbackState,name){const c=byId(S[coll],id);return c?{name:c.name,gstin:(c.gstin||'').toUpperCase(),state:c.state||fallbackState,address:c.address||'',phone:c.phone||''}:{name:name||'Cash customer',gstin:'',state:fallbackState,address:'',phone:''}}

/* ---------- posting (the single source of truth for every transaction) ---------- */
function postSale(d){const st=stock();const simB={...st.b};const inter=d.pos!==S.settings.state;
 const lines=d.lines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,batchSel:l.batchSel||'auto',qty:+l.qty,rate:+l.rate,disc:+l.disc||0,gst:+l.gst}));
 for(const l of lines){if(l.batchSel!=='auto'){l.alloc=[{batchId:l.batchSel,qty:l.qty}];simB[l.batchSel]=r3((simB[l.batchSel]||0)-l.qty)}else l.alloc=allocate(l.itemId,l.qty,simB);l.batchText=batchText(l.alloc);
  l.cost=r2(l.alloc.reduce((a,x)=>{const b=byId(S.batches,x.batchId);return a+x.qty*((b&&b.cost)||unitCostNow(l.itemId))},0)/l.qty)}
 const t=calcLines(lines,inter);const id=uid();
 const s={id,no:nextNo('INV',d.date),date:d.date,customerId:d.customerId||'',party:partyOf('customers',d.customerId,d.pos,d.walkinName),pos:d.pos,inter,lines,...t,payMode:d.payMode||'Cash',payRef:d.payRef||'',orderId:d.orderId||'',notes:d.notes||'',cancelled:false,created:new Date().toISOString()};
 S.sales.push(s);for(const l of lines)for(const a of l.alloc)addMove(l.itemId,a.batchId,-a.qty,'sale',id,d.date);
 if(s.payMode&&!/^Credit/.test(s.payMode)&&s.total>0)postReceipt({date:s.date,customerId:s.customerId,partyName:s.party.name,mode:s.payMode,ref:d.payRef||'',amount:s.total,allocs:[{saleId:s.id,amt:s.total}],auto:true});return s}
function postPurchase(d){const sup=byId(S.suppliers,d.supplierId);const sst=(sup&&sup.state)||S.settings.state;const inter=sst!==S.settings.state;
 const lines=d.lines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,batchNo:l.batchNo,mfg:l.mfg||'',exp:l.exp||'',qty:+l.qty,rate:+l.rate,disc:0,gst:+l.gst}));
 const t=calcLines(lines,inter);const id=uid();
 for(const l of lines){const b=getBatch(l.itemId,l.batchNo,l.mfg||d.date,l.exp,l.rate);l.batchId=b.id;l.batchNo=b.no;l.batchText=b.no+(b.exp?' (exp '+dmy(b.exp)+')':'')}
 const p={id,no:nextNo('PUR',d.date),date:d.date,supplierId:d.supplierId||'',party:partyOf('suppliers',d.supplierId,sst,'Unknown supplier'),supInvNo:d.supInvNo||'',supInvDate:d.supInvDate||d.date,inter,lines,...t,cancelled:false,created:new Date().toISOString()};
 S.purchases.push(p);for(const l of lines)addMove(l.itemId,l.batchId,l.qty,'purchase',id,d.date);return p}
function returnedQty(coll,key,docId,idx){return S[coll].filter(r=>!r.cancelled&&r[key]===docId).reduce((s,r)=>s+r.lines.filter(l=>l.idx===idx).reduce((a,l)=>a+l.qty,0),0)}
function postSalesReturn(d){const inv=byId(S.sales,d.invoiceId);const lines=d.lines.filter(x=>+x.qty>0).map(x=>{const o=inv.lines[x.idx];const ab=(o.alloc||[]).find(a=>a.batchId);
  return{idx:x.idx,itemId:o.itemId,name:o.name,hsn:o.hsn,unit:o.unit,qty:+x.qty,rate:o.rate,disc:o.disc,gst:o.gst,batchId:ab?ab.batchId:null,batchText:ab?batchText([ab]):''}});
 const t=calcLines(lines,inv.inter);const id=uid();
 const r={id,no:nextNo('CN',d.date),date:d.date,invoiceId:inv.id,invoiceNo:inv.no,invoiceDate:inv.date,party:inv.party,pos:inv.pos,inter:inv.inter,reason:d.reason||'',restock:!!d.restock,lines,...t,cancelled:false};
 S.salesReturns.push(r);if(r.restock)for(const l of lines)addMove(l.itemId,l.batchId,l.qty,'sales-return',id,d.date);return r}
function postPurchaseReturn(d){const p=byId(S.purchases,d.purchaseId);const lines=d.lines.filter(x=>+x.qty>0).map(x=>{const o=p.lines[x.idx];
  return{idx:x.idx,itemId:o.itemId,name:o.name,hsn:o.hsn,unit:o.unit,qty:+x.qty,rate:o.rate,disc:0,gst:o.gst,batchId:o.batchId,batchText:o.batchText}});
 const t=calcLines(lines,p.inter);const id=uid();
 const r={id,no:nextNo('DN',d.date),date:d.date,purchaseId:p.id,purchaseNo:p.no,supInvNo:p.supInvNo,supInvDate:p.supInvDate,party:p.party,pos:p.party.state,inter:p.inter,reason:d.reason||'',lines,...t,cancelled:false};
 S.purchaseReturns.push(r);for(const l of lines)addMove(l.itemId,l.batchId,-l.qty,'purchase-return',id,d.date);return r}
function postProduction(d){const it=byId(S.items,d.itemId);const exp=d.exp||(it&&it.shelfDays?addDays(d.date,it.shelfDays):'');const id=uid();
 const simB={...stock().b};const inputs=d.inputs.filter(x=>x.itemId&&+x.qty>0).map(x=>{const alloc=allocate(x.itemId,+x.qty,simB);return{itemId:x.itemId,qty:+x.qty,alloc}});
 let cost=0;for(const x of inputs)for(const a of x.alloc){const b=byId(S.batches,a.batchId);cost+=a.qty*((b&&b.cost)||itemCost(x.itemId))}
 const unitCost=+d.qty?r2(cost/+d.qty):0;const b=getBatch(d.itemId,d.batchNo,d.date,exp,unitCost||itemCost(d.itemId));
 const labour=Object.entries(d.wk||{}).filter(([k,v])=>v!=null&&v!==false).map(([k,v])=>{const w=byId(S.workers,k)||{};return{workerId:k,name:w.name||'?',amt:+v||0}});
 const lab=r2(labour.reduce((a2,x)=>a2+x.amt,0)),elec=r2((+d.elecUnits||0)*(+d.elecRate||0)),fuel=r2(+d.fuel||0),oth=r2(+d.other||0);
 const costs={labour:lab,elec,elecUnits:+d.elecUnits||0,elecRate:+d.elecRate||0,fuel,other:oth,otherNote:d.otherNote||''};const lot=r2(cost+lab+elec+fuel+oth);
 const p={id,no:nextNo('PRD',d.date),date:d.date,itemId:d.itemId,qty:+d.qty,batchId:b.id,batchNo:b.no,exp:b.exp,inputs,unitCost,matCost:r2(cost),labour,costs,lotCost:lot,lotUnit:+d.qty?r2(lot/+d.qty):0,notes:d.notes||'',cancelled:false};
 if(d.payExp){const mk=(cat,amt,payee,desc)=>{if(amt>0){const e=postExpense({date:d.date,kind:'OpEx',category:cat,behaviour:'Variable',amount:amt,payee,desc,mode:'Cash'});e.prodId=id}};
  const cl=labour.filter(x=>(byId(S.workers,x.workerId)||{}).payType!=='Per month');mk('Labour charges (daily / piece rate)',r2(cl.reduce((a2,x)=>a2+x.amt,0)),cl.map(x=>x.name).join(', '),'Wages for production '+p.no+' ('+labour.length+' workers)');mk('Fuel / gas / firewood for cooking',fuel,'','Fuel for production '+p.no);mk('Production consumables (gloves, caps, cleaning)',oth,'',(d.otherNote||'Other costs')+' for production '+p.no)}
 S.production.push(p);addMove(d.itemId,b.id,+d.qty,'production',id,d.date);for(const x of inputs)for(const a of x.alloc)addMove(x.itemId,a.batchId,-a.qty,'consumed',id,d.date);return p}
function postAdjust(d){const it=byId(S.items,d.itemId);let b;if(d.batchSel&&d.batchSel!=='new')b=byId(S.batches,d.batchSel);else b=getBatch(d.itemId,d.batchNo,d.mfg||d.date,d.exp||(it&&it.shelfDays&&d.mfg?addDays(d.mfg,it.shelfDays):''),d.cost||itemCost(d.itemId));
 const id=uid();const a={id,no:nextNo('ADJ',d.date),date:d.date,itemId:d.itemId,batchId:b.id,batchNo:b.no,qty:+d.qty,reason:d.reason||'Adjustment',cancelled:false};S.adjustments.push(a);addMove(d.itemId,b.id,+d.qty,'adjust',id,d.date);return a}
function postOrder(d){const id=uid();const o={id,no:nextNo('SO',d.date),date:d.date,due:d.due||'',customerId:d.customerId||'',party:partyOf('customers',d.customerId,S.settings.state,d.walkinName),lines:d.lines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,qty:+l.qty,rate:+l.rate||0})),notes:d.notes||'',status:'open'};S.orders.push(o);return o}
function orderProgress(o){return o.lines.map(l=>{const del=S.sales.filter(s=>!s.cancelled&&s.orderId===o.id).reduce((a,s)=>a+s.lines.filter(x=>x.itemId===l.itemId).reduce((b,x)=>b+x.qty,0),0);return{...l,delivered:r3(del),pending:o.status==='open'?Math.max(0,r3(l.qty-del)):0}})}
function orderStatus(o){if(o.status==='cancelled')return['Cancelled','grey'];if(o.status==='closed')return['Closed','grey'];const p=orderProgress(o);const pend=p.reduce((a,l)=>a+l.pending,0),del=p.reduce((a,l)=>a+l.delivered,0);
 if(pend<=0)return['Delivered','green'];if(o.due&&o.due<today())return[del?'Partly delivered · OVERDUE':'Pending · OVERDUE','red'];return[del?'Partly delivered':'Pending','amber']}

/* ---------- alerts ---------- */
function alerts(){const st=stock(),t=today(),warn=addDays(t,S.settings.expiryWarnDays||30),out=[];
 const s=S.settings;if(!s.name||!s.state)out.push({lvl:'red',type:'Setup',text:'Business name and state are missing. Invoices need them.',btn:['Open settings',"go('settings')"]});
 for(const it of S.items){const q=st.it[it.id]||0;if(q<0)out.push({lvl:'red',type:'Negative stock',text:`${it.name}: stock is ${qf(q)} ${it.unit}. More was sold or used than was recorded in. Enter the missing purchase, production or opening stock.`,btn:['Fix stock',`go('stock')`]});
  else if(+it.reorder&&q<=+it.reorder)out.push({lvl:'amber',type:'Low stock',text:`${it.name}: only ${qf(q)} ${it.unit} left (reorder level ${qf(it.reorder)}).`,btn:['Demand vs supply',"go('demand')"]})}
 for(const b of S.batches){if(b.closed)continue;const q=st.b[b.id]||0;const it=byId(S.items,b.itemId)||{name:'?',unit:''};
  if(q<0)out.push({lvl:'red',type:'Negative batch',text:`Batch ${b.no} of ${it.name} shows ${qf(q)} ${it.unit}. Check the batch chosen on recent bills.`,btn:['View stock',"go('stock')"]});
  else if(q===0)out.push({lvl:'grey',type:'Zero batch',text:`Batch ${b.no} of ${it.name} is empty.`,btn:['Close batch',`closeBatch('${b.id}')`]});
  else if(b.exp&&b.exp<t)out.push({lvl:'red',type:'Expired stock',text:`Batch ${b.no} of ${it.name}: ${qf(q)} ${it.unit} expired on ${dmy(b.exp)}. Do not sell. Write it off.`,btn:['Write off',`writeOff('${b.id}')`]});
  else if(b.exp&&b.exp<=warn)out.push({lvl:'amber',type:'Expiring soon',text:`Batch ${b.no} of ${it.name}: ${qf(q)} ${it.unit} expires on ${dmy(b.exp)}. Sell this first.`})}
 for(const o of S.orders){const [lab,c]=orderStatus(o);if(c==='red')out.push({lvl:'amber',type:'Overdue order',text:`${o.no} for ${o.party.name} was due ${dmy(o.due)}.`,btn:['Make invoice',`saleFromOrder('${o.id}')`]})}
 moneyAlerts(out);
 for(const x of belowCost().slice(0,5))out.push({lvl:'red',type:'Sold below cost',text:`${x.s.no} (${dmy(x.s.date)}): ${x.l.name} sold at ${money(x.net)} per unit, cost ${money(x.c)}. Check the rate or discount.`,btn:['Profit page',"go('profit')"]});
 {const q60=itemQtySold(addDays(t,-59),t);for(const it of S.items.filter(i=>i.type==='Finished')){const q=st.it[it.id]||0;if(q>0&&!(q60[it.id]>0)&&S.sales.length)out.push({lvl:'amber',type:'Dead stock',text:`${it.name}: ${qf(q)} ${it.unit} in stock with no sale in 60 days. Offer a discount or bundle.`})}}
 const lb=S.lastBackup;const days=lb?Math.floor((Date.now()-new Date(lb))/864e5):999;
 if(!FH&&S.sales.length+S.purchases.length>0&&days>=(s.backupDays||7))out.push({lvl:'amber',type:'Backup due',text:lb?`Last backup was ${days} days ago.`:'No backup has been taken yet.',btn:['Back up now','backupNow()']});
 if(FH&&AUTO_NEEDS)out.push({lvl:'amber',type:'Auto-backup paused',text:'Click to allow writing to your backup file again.',btn:['Reconnect','reconnectFH()']});
 const ord={red:0,amber:1,grey:2};return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl])}
function closeBatch(id){const b=byId(S.batches,id);b.closed=true;commit('Batch closed')}

function saleShortages(d){const need={},msgs=[];const st=stock();for(const l of d.lines){if(!l.itemId||!(+l.qty>0))continue;
  if(l.batchSel&&l.batchSel!=='auto'){const b=byId(S.batches,l.batchSel);const q=st.b[l.batchSel]||0;if(+l.qty>q)msgs.push(`Batch ${b.no} has only ${qf(q)}; you are billing ${qf(l.qty)}.`);if(b.exp&&b.exp<today())msgs.push(`Batch ${b.no} is EXPIRED.`)}
  else need[l.itemId]=(need[l.itemId]||0)+(+l.qty)}
 for(const id in need){const av=available(id);if(need[id]>av){const it=byId(S.items,id);msgs.push(`${it.name}: only ${qf(av)} ${it.unit} in stock; billing ${qf(need[id])}.`)}}return msgs}
function saveSale(print){const lines=D.lines.filter(l=>l.itemId&&+l.qty>0);if(!lines.length)return toast('Add at least one product with quantity');if(!D.pos)return toast('Choose the place of supply');
 if(!S.settings.state)return toast('Set your business state in Settings first');
 const sh=saleShortages(D);if(sh.length&&!confirm('Stock warning:\n\n'+sh.join('\n')+'\n\nSave anyway? Stock will go negative and appear in Alerts.'))return;
 const s=postSale(D);D=null;commit('Invoice '+s.no+' saved');if(print)printDoc('sale',s.id)}
function cancelSale(id){const s=byId(S.sales,id);if(S.salesReturns.some(r=>!r.cancelled&&r.invoiceId===id))return alert('This invoice has a credit note. Cancel the credit note first.');
 if(!confirm(`Cancel invoice ${s.no}? The number stays used and is reported as cancelled. Stock goes back.`))return;s.cancelled=true;s.cancelledOn=today();removeMoves(id);for(const r of S.receipts){if(r.auto&&r.allocs.length===1&&r.allocs[0].saleId===id)r.cancelled=true;else r.allocs=r.allocs.filter(a=>a.saleId!==id)}commit('Invoice cancelled')}

function newProduction(){const fin=S.items.filter(i=>i.type==='Finished');if(!fin.length){go('items');toast('Add a finished product first');return}PAGE='production';D={kind:'production',date:today(),itemId:fin[0].id,qty:0,batchNo:autoBatch(today()),exp:'',notes:'',inputs:[{itemId:'',qty:0}],wk:{},elecUnits:0,elecRate:S.settings.elecRate||8,fuel:0,other:0,otherNote:'',payExp:true};render()}
function dailyProd(n){const t=today(),MK=HEADS.filter(h=>h[1]==='make'&&!/Wastage|Depreciation/.test(h[0])).map(h=>h[0]),rc={};
 const mRate=m=>{if(rc[m]!=null)return rc[m];const [y,mo]=m.split('-').map(Number);const a=m+'-01',e=`${m}-${pad(new Date(y,mo,0).getDate())}`,b=e<t?e:t;
  const q=S.production.filter(p=>!p.cancelled&&p.date>=a&&p.date<=b).reduce((s2,p)=>s2+p.qty,0);
  const runE=S.production.some(p=>!p.cancelled&&p.date>=a&&p.date<=b&&p.costs&&p.costs.elec>0);const fx=S.expenses.filter(x=>!x.cancelled&&!x.prodId&&x.kind==='OpEx'&&x.behaviour==='Fixed'&&x.date>=a&&x.date<=b&&MK.includes(headOfCat(x.category))&&!(runE&&x.category==='Electricity')).reduce((s2,x)=>s2+x.amount,0)+depreciation(a,b);
  return rc[m]=q?fx/q:0};
 const out=[];for(let i=0;i<n;i++){const d=addDays(t,-i);const runs=S.production.filter(p=>!p.cancelled&&p.date===d);const h={};let qty=0;const items={};
  for(const p of runs){qty+=p.qty;const it=byId(S.items,p.itemId)||{};items[it.name]=(items[it.name]||0)+p.qty;for(const x of p.inputs||[])for(const al of x.alloc||[]){const bt=byId(S.batches,al.batchId);const hd=headOfItem(x.itemId);h[hd]=(h[hd]||0)+al.qty*((bt&&bt.cost)||itemCost(x.itemId))}}
  const mat=Object.values(h).reduce((a2,b2)=>a2+b2,0);
  const dx=S.expenses.filter(x=>!x.cancelled&&!x.prodId&&x.kind==='OpEx'&&x.date===d&&x.behaviour!=='Fixed'&&MK.includes(headOfCat(x.category)));for(const x of dx){const hd=headOfCat(x.category);h[hd]=(h[hd]||0)+x.amount}
  const rcst=runs.reduce((a2,p)=>a2+(p.costs?p.costs.labour+p.costs.elec+p.costs.fuel+p.costs.other:0),0);
  const direct=dx.reduce((a2,x)=>a2+x.amount,0)+rcst,over=qty*mRate(d.slice(0,7)),tot=mat+direct+over;
  let sq=0,sv=0;for(const sl of S.sales)if(!sl.cancelled&&sl.date===d)for(const l of sl.lines)if((byId(S.items,l.itemId)||{}).type==='Finished'){sq+=l.qty;sv+=l.taxable}
  if(runs.length||direct)out.push({d,runs:runs.length,qty,items,h,mat,direct,over,tot,pu:qty?tot/qty:null,sq,sp:sq?sv/sq:null})}
 return out}

function estMat(){const simB={...stock().b};let c=0;for(const x of D.inputs)if(x.itemId&&+x.qty>0)for(const a of allocate(x.itemId,+x.qty,simB)){const b=byId(S.batches,a.batchId);c+=a.qty*((b&&b.cost)||itemCost(x.itemId))}return c}
function prodSum(){const mat=estMat(),lab=Object.values(D.wk).reduce((a,v)=>a+(+v||0),0),elec=(+D.elecUnits||0)*(+D.elecRate||0),tot=mat+lab+elec+(+D.fuel||0)+(+D.other||0);
 return `<table style="max-width:420px">${[['Materials (from stock cost)',mat],['Labour ('+Object.keys(D.wk).length+' workers)',lab],['Electricity',elec],['Fuel / gas',+D.fuel||0],['Other',+D.other||0]].map(([l,v])=>`<tr><td>${l}</td><td class="n">${money(v)}</td></tr>`).join('')}<tr><td><b>Lot cost</b></td><td class="n"><b>${money(tot)}</b></td></tr><tr><td><b>Cost per unit</b></td><td class="n"><b>${D.qty>0?money(tot/D.qty):'enter quantity'}</b></td></tr></table>`}
function prodUpd(){const el=document.getElementById('prodSum');if(el)el.innerHTML=prodSum()}
function wkRate(w){return w.payType==='Per month'?r2((+w.wage||0)/26):(+w.wage||0)}

function wkActive(w,d){d=d||today();return w.active!=='No'&&(!w.doj||w.doj<=d)&&(!w.dor||w.dor>=d)}
function prodCostsHTML(){const ws=S.workers.filter(w=>wkActive(w,D.date));
 return `<div class="card"><h2>Workers on this run</h2>${ws.length?`<div class="row" style="margin-bottom:6px"><button class="btn s o" onclick="S.workers.filter(w=>wkActive(w,D.date)).forEach(w=>D.wk[w.id]=wkRate(w));render()">Tick all</button><button class="btn s o" onclick="D.wk={};render()">Clear</button></div>
 <div style="display:grid;gap:6px 14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${ws.map(w=>{const on=D.wk[w.id]!=null;return `<div class="row" style="align-items:center;gap:6px;flex-wrap:nowrap"><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--txt);font-size:14px;flex:1"><input type="checkbox" ${on?'checked':''} onchange="wkTick('${w.id}',this.checked)"> ${esc(w.name)}${w.role?` <span class="mut" style="font-size:12px">${esc(w.role)}</span>`:''}</label>${on?`<input type="number" step="any" style="width:90px" value="${D.wk[w.id]}" oninput="D.wk['${w.id}']=+this.value;prodUpd()" title="Wage for this run (₹)">`:''}</div>`}).join('')}</div>`
 :S.workers.length?`<p class="mut">No worker is on the rolls on this date (check joining / leaving dates in <a href="#" onclick="go('workers');return false">Workers</a>).</p>`:`<p class="mut">No workers added yet. <a href="#" onclick="go('workers');return false">Add your workers</a> once (name and daily wage), then tick who worked on each run.</p>`}</div>
 <div class="card"><h2>Other costs of this lot</h2><div class="f"><div><label>Electricity used (units / kWh)</label><input type="number" step="any" value="${D.elecUnits||''}" oninput="D.elecUnits=+this.value;prodUpd()"></div><div><label>Rate per unit (₹)</label><input type="number" step="any" value="${D.elecRate}" oninput="D.elecRate=+this.value;S.settings.elecRate=+this.value;prodUpd()"></div>
 <div><label>Fuel / gas / firewood (₹)</label><input type="number" step="any" value="${D.fuel||''}" oninput="D.fuel=+this.value;prodUpd()"></div><div><label>Other costs (₹)</label><input type="number" step="any" value="${D.other||''}" oninput="D.other=+this.value;prodUpd()"></div><div><label>What were the other costs?</label><input value="${esc(D.otherNote)}" oninput="D.otherNote=this.value" placeholder="e.g. washing, drying charges"></div></div>
 <div class="f"><div><label>Notes for this lot</label><textarea rows="2" oninput="D.notes=this.value">${esc(D.notes)}</textarea></div></div>
 <label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:14px"><input type="checkbox" ${D.payExp?'checked':''} onchange="D.payExp=this.checked"> Also record daily wages, fuel and other costs as cash expenses paid today</label>
 <div class="mut" style="font-size:12.5px;margin:4px 0 10px">Electricity here is only used to cost the lot; keep entering the monthly electricity bill under Expenses. Monthly-salaried staff are costed at salary ÷ 26 per run; their salary stays a monthly expense.</div><div id="prodSum">${prodSum()}</div></div>`}
function saveProd(){if(!D.itemId||!(D.qty>0))return toast('Enter the product and quantity made');const short=D.inputs.filter(x=>x.itemId&&x.qty>available(x.itemId)).map(x=>{const r=byId(S.items,x.itemId);return `${r.name}: need ${x.qty}, have ${available(x.itemId)}`});

 :`<div class="card scroll"><table><tr><th>Debit note</th><th>Date</th><th>Against purchase</th><th>Supplier</th><th>Items</th><th>Reason</th><th class="n">Value</th><th></th></tr>${pr.map(r=>`<tr><td><b>${esc(r.no)}</b>${r.cancelled?' '+pill('Cancelled','grey'):''}</td><td>${dmy(r.date)}</td><td>${esc(r.purchaseNo)}<div class="mut">bill ${esc(r.supInvNo)}</div></td><td>${esc(r.party.name)}</td><td>${r.lines.map(l=>esc(l.name)+' × '+qf(l.qty)).join('<br>')}</td><td>${esc(r.reason)}</td><td class="n">${f2(r.total)}</td><td style="white-space:nowrap">${attBtn('purchaseReturn',r.id)}<button class="btn s o" onclick="printDoc('dn','${r.id}')">🖨 Print</button>${r.cancelled?'':`<button class="btn s o" onclick="cancelRet('purchaseReturns','${r.id}')">Cancel</button>`}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">No supplier returns.</td></tr>'}</table></div>`)};
function newSret(){const inv=S.sales.filter(s=>!s.cancelled);if(!inv.length)return toast('No invoices to return against');PAGE='returns';TAB.ret='s';D={kind:'sret',date:today(),invoiceId:inv[inv.length-1].id,reason:'Damaged',restock:true,qty:{}};render()}

 <div><label>Reason</label><select onchange="D.reason=this.value">${['Damaged','Expired / near expiry','Quality complaint','Wrong item sent','Excess supply','Other'].map(x=>opt(x,x,D.reason)).join('')}</select></div>
 <div><label>&nbsp;</label><label style="color:var(--txt)"><input type="checkbox" ${D.restock?'checked':''} onchange="D.restock=this.checked"> Put returned goods back into stock (untick if damaged/expired)</label></div></div></div>

 <div><label>Reason</label><select onchange="D.reason=this.value">${['Quality issue','Damaged in transit','Wrong item','Excess quantity','Expired','Other'].map(x=>opt(x,x,D.reason)).join('')}</select></div></div></div>
 <div class="card"><table><tr><th>Item</th><th>Batch</th><th class="n">Received</th><th class="n">Already returned</th><th class="n">Batch stock now</th><th>Return qty</th></tr>${p.lines.map((l,i)=>{const done=returnedQty('purchaseReturns','purchaseId',p.id,i);return `<tr><td>${esc(l.name)}</td><td>${esc(l.batchText)}</td><td class="n">${qf(l.qty)}</td><td class="n">${qf(done)}</td><td class="n">${qf(st.b[l.batchId]||0)}</td><td><input type="number" step="any" min="0" style="width:100px" value="${D.qty[i]||''}" oninput="D.qty[${i}]=Math.min(+this.value,${r3(l.qty-done)})"></td></tr>`}).join('')}</table></div>
 <div class="row"><button class="btn" onclick="savePret()">Save debit note</button><button class="btn o" onclick="go('returns')">Discard</button></div>`}

R.stock=()=>{if(D&&D.kind==='adj')return adjForm();const st=stock(),t=today(),warn=addDays(t,S.settings.expiryWarnDays||30);const f=TAB.stk||'all';
 const items=S.items.filter(i=>f==='all'||i.type===f);
 return head('Stock & batches','<button class="btn o" onclick="newAdj(1)">+ Opening stock</button><button class="btn o" onclick="newAdj(-1)">Stock correction / wastage</button>')+tabs('stk',[['all','All'],['Finished','Finished goods'],['Raw material','Raw materials'],['Packing','Packing']])+noItemsHint()+
 items.map(it=>{const q=st.it[it.id]||0;const bs=S.batches.filter(b=>b.itemId===it.id&&(!b.closed||(st.b[b.id]||0)!==0)).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'));const exp=bs.filter(b=>b.exp&&b.exp<t).reduce((s,b)=>s+Math.max(0,st.b[b.id]||0),0);
  const status=q<0?pill('Negative','red'):(+it.reorder&&q<=+it.reorder)?pill('Low','amber'):pill('OK','green');
  return `<div class="card"><div class="row"><h2 style="margin:0">${esc(it.name)}</h2><span class="mut">${esc(it.type)} · HSN ${esc(it.hsn)}</span><span class="sp"></span>${status}<b style="font-size:18px">${qf(q)} ${esc(it.unit)}</b></div>
  ${exp?`<div class="dn" style="font-size:13px">${qf(exp)} ${esc(it.unit)} of this is expired</div>`:''}
  ${bs.length?`<table style="margin-top:6px"><tr><th>Batch</th><th>Made / received</th><th>Expiry</th><th class="n">Qty</th><th class="n">Cost/unit</th><th>Status</th><th></th></tr>${bs.map(b=>{const bq=st.b[b.id]||0;const s=bq<0?pill('Negative','red'):bq===0?pill('Empty','grey'):b.exp&&b.exp<t?pill('Expired','red'):b.exp&&b.exp<=warn?pill('Expiring soon','amber'):pill('Good','green');
   return `<tr><td>${esc(b.no)}</td><td>${dmy(b.mfg)}</td><td>${dmy(b.exp)}</td><td class="n">${qf(bq)}</td><td class="n">${b.cost?f2(b.cost):'-'}</td><td>${s}</td><td>${bq===0?`<button class="btn s o" onclick="closeBatch('${b.id}')">Close</button>`:''}${bq>0&&b.exp&&b.exp<t?`<button class="btn s o" onclick="writeOff('${b.id}')">Write off</button>`:''}</td></tr>`}).join('')}</table>`:'<div class="mut">No batches yet.</div>'}
  ${q<0&&!bs.some(b=>(st.b[b.id]||0)<0)?`<div class="mut" style="font-size:13px">${qf(-Math.min(0,q-bs.reduce((s,b)=>s+(st.b[b.id]||0),0)))} sold without any batch in stock.</div>`:''}</div>`}).join('')};

 return head(D.sign>0?'Add opening stock / stock found':'Stock correction / wastage')+`<div class="card"><div class="f"><div><label>Date</label><input type="date" value="${D.date}" onchange="D.date=this.value"></div>
 <div><label>Item</label><select onchange="D.itemId=this.value;D.batchSel=D.sign>0?'new':'';render()">${itemOpts(D.itemId)}</select></div>
 <div><label>Batch</label><select onchange="D.batchSel=this.value;render()">${D.sign>0?opt('new','New batch',D.batchSel):''}${bs.map(b=>opt(b.id,b.no+' · '+qf(st.b[b.id]||0)+' left'+(b.exp?' · exp '+dmy(b.exp):''),D.batchSel)).join('')}</select></div>
 ${D.batchSel==='new'?`<div><label>Batch number</label><input value="${esc(D.batchNo)}" placeholder="auto" oninput="D.batchNo=this.value"></div><div><label>Mfg date</label><input type="date" value="${D.mfg}" onchange="D.mfg=this.value"></div><div><label>Expiry date</label><input type="date" value="${D.exp}" placeholder="auto" onchange="D.exp=this.value"><div class="mut" style="font-size:12px">${it&&it.shelfDays?'Blank = mfg + '+it.shelfDays+' days':''}</div></div><div><label>Cost per unit</label><input type="number" step="any" value="${D.cost}" oninput="D.cost=this.value"></div>`:''}
 <div><label>Quantity ${D.sign>0?'to add':'to remove'} (${esc(it?it.unit:'')})</label><input type="number" step="any" min="0" value="${D.qty||''}" oninput="D.qty=+this.value"></div>

R.demand=()=>{const t=today(),st=stock();const q30=itemQtySold(addDays(t,-29),t);const pend={};for(const o of S.orders)for(const l of orderProgress(o))pend[l.itemId]=(pend[l.itemId]||0)+l.pending;
 const q7=itemQtySold(addDays(t,-6),t),q28=itemQtySold(addDays(t,-27),t);const rows=S.items.filter(i=>i.type==='Finished').map(it=>{const av=available(it.id),dem=pend[it.id]||0,rate=0.6*(q7[it.id]||0)/7+0.4*(q28[it.id]||0)/28,need14=Math.ceil(rate*(+(it.leadDays)||3)+rate*9);const short=Math.max(0,dem-av);const suggest=Math.max(0,Math.ceil(dem+need14+(+it.reorder||0)-av));
  return{it,av,dem,rate,short,suggest,cover:rate?Math.floor(Math.max(0,av-dem)/rate):null}}).sort((a,b)=>b.short-a.short||b.suggest-a.suggest);
 const raw=S.items.filter(i=>i.type!=='Finished').map(it=>({it,av:available(it.id),used:-S.moves.filter(m=>m.itemId===it.id&&m.type==='consumed'&&m.date>=addDays(t,-29)).reduce((s,m)=>s+m.qty,0)}));
 return head('Demand vs supply')+`<div class="card mut">Demand = pending customer orders. Supply = stock that has not expired. Sales speed = 60% last 7 days + 40% last 28 days. “Make / buy” covers pending orders, the production lead time plus 7 days review and 2 days safety, and keeps you above the reorder level.</div>
 <div class="card scroll"><h2>Finished products</h2><table><tr><th>Product</th><th class="n">Pending orders</th><th class="n">Good stock</th><th class="n">Shortfall</th><th class="n">Avg sales/day</th><th class="n">Stock lasts</th><th class="n">Make / buy now</th></tr>
 ${rows.map(r=>`<tr><td>${esc(r.it.name)}</td><td class="n">${qf(r.dem)}</td><td class="n">${qf(r.av)}</td><td class="n">${r.short?`<b class="dn">${qf(r.short)}</b>`:'0'}</td><td class="n">${r2(r.rate)}</td><td class="n">${r.cover===null?'-':r.cover+' days'}</td><td class="n">${r.suggest?`<b>${qf(r.suggest)} ${esc(r.it.unit)}</b>`:'<span class="up">enough</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">No finished products.</td></tr>'}</table></div>
 <div class="card scroll"><h2>Raw materials & packing</h2><table><tr><th>Item</th><th class="n">Good stock</th><th class="n">Used last 30 days</th><th class="n">Lasts</th><th class="n">Reorder level</th></tr>${raw.map(r=>`<tr><td>${esc(r.it.name)}</td><td class="n">${qf(r.av)} ${esc(r.it.unit)}</td><td class="n">${qf(r.used)}</td><td class="n">${r.used?Math.floor(r.av/(r.used/30))+' days':'-'}</td><td class="n">${r.av<=(+r.it.reorder||0)?`<b class="dn">${qf(r.it.reorder)}</b>`:qf(r.it.reorder)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">None.</td></tr>'}</table></div>`};

let REP={from:today().slice(0,8)+'01',to:today()};let RD={};
function setMonth(v){if(!v)return;const [y,m]=v.split('-').map(Number);REP.from=v+'-01';REP.to=ymd(new Date(y,m,0));render()}
const inP=d=>d>=REP.from&&d<=REP.to;
function rtable(key,title,h,rows,note){RD[key]={h,rows,title};return `<div class="card"><div class="row"><h2 style="margin:0">${esc(title)}</h2><span class="mut">${rows.length} row(s)</span><span class="sp"></span><button class="btn s o" onclick="dlRep('${key}')">⬇ Excel (CSV)</button></div>${note?`<div class="mut" style="font-size:13px">${note}</div>`:''}<div class="scroll" style="margin-top:6px"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>typeof c==='number'?`<td class="n">${c.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})}</td>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mut">Nothing in this period.</td></tr>`}</table></div></div>`}
function dlRep(k){const d=RD[k];csv(d.title+'_'+REP.from+'_to_'+REP.to,d.h,d.rows)}
function dlAll(keys,name){const parts=keys.filter(k=>RD[k]).map(k=>csvText([RD[k].title],[])+'\r\n'+csvText(RD[k].h,RD[k].rows));download(name+'_'+REP.from+'_to_'+REP.to+'.csv','\ufeff'+parts.join('\r\n\r\n'),'text/csv;charset=utf-8')}
function byRate(doc){const m={};for(const l of doc.lines){const k=l.gst;m[k]=m[k]||{rate:k,taxable:0,igst:0,cgst:0,sgst:0};m[k].taxable+=l.taxable;m[k].igst+=l.igst;m[k].cgst+=l.cgst;m[k].sgst+=l.sgst}return Object.values(m).map(x=>({...x,taxable:r2(x.taxable),igst:r2(x.igst),cgst:r2(x.cgst),sgst:r2(x.sgst)}))}

 const sales=S.sales.filter(s=>!s.cancelled&&inP(s.date)),cns=S.salesReturns.filter(r=>!r.cancelled&&inP(r.date));

 const b2b=[],b2cl=[],b2cs={},cdnr=[],cdnur=[],hsn={};
 for(const s of sales){for(const x of byRate(s)){if(s.party.gstin)b2b.push([s.party.gstin,s.party.name,s.no,dmy(s.date),s.total,stName(s.pos),'N','Regular B2B',x.rate,x.taxable,x.igst,x.cgst,x.sgst,0]);
  else if(isB2CL(s))b2cl.push([s.no,dmy(s.date),s.total,stName(s.pos),x.rate,x.taxable,x.igst,0]);
  else{const k=s.pos+'|'+x.rate;b2cs[k]=b2cs[k]||{pos:s.pos,rate:x.rate,taxable:0,igst:0,cgst:0,sgst:0};const o=b2cs[k];o.taxable+=x.taxable;o.igst+=x.igst;o.cgst+=x.cgst;o.sgst+=x.sgst}}}
 for(const r of cns){const inv=byId(S.sales,r.invoiceId);for(const x of byRate(r)){if(r.party.gstin)cdnr.push([r.party.gstin,r.party.name,r.no,dmy(r.date),'Credit note',stName(r.pos),'N','Regular B2B',r.total,x.rate,x.taxable,x.igst,x.cgst,x.sgst,r.invoiceNo]);
  else if(inv&&isB2CL(inv))cdnur.push(['B2CL',r.no,dmy(r.date),'Credit note',stName(r.pos),r.total,x.rate,x.taxable,x.igst,r.invoiceNo]);
  else{const k=r.pos+'|'+x.rate;b2cs[k]=b2cs[k]||{pos:r.pos,rate:x.rate,taxable:0,igst:0,cgst:0,sgst:0};const o=b2cs[k];o.taxable-=x.taxable;o.igst-=x.igst;o.cgst-=x.cgst;o.sgst-=x.sgst}}}
 const addH=(doc,sign)=>{const typ=doc.party.gstin?'B2B':'B2C';for(const l of doc.lines){const k=typ+'|'+l.hsn+'|'+l.unit+'|'+l.gst;hsn[k]=hsn[k]||{typ,hsn:l.hsn,desc:l.name,uqc:l.unit,rate:l.gst,qty:0,val:0,taxable:0,igst:0,cgst:0,sgst:0};const h=hsn[k];h.qty+=sign*l.qty;h.val+=sign*l.total;h.taxable+=sign*l.taxable;h.igst+=sign*l.igst;h.cgst+=sign*l.cgst;h.sgst+=sign*l.sgst}};
 sales.forEach(s=>addH(s,1));cns.forEach(r=>addH(r,-1));
 const allInv=S.sales.filter(s=>inP(s.date)).sort((a,b)=>a.no.localeCompare(b.no)),allCn=S.salesReturns.filter(r=>inP(r.date)).sort((a,b)=>a.no.localeCompare(b.no));
 const docs=[];if(allInv.length)docs.push(['Invoices for outward supply',allInv[0].no,allInv[allInv.length-1].no,allInv.length,allInv.filter(s=>s.cancelled).length,allInv.length-allInv.filter(s=>s.cancelled).length]);
 if(allCn.length)docs.push(['Credit notes',allCn[0].no,allCn[allCn.length-1].no,allCn.length,allCn.filter(s=>s.cancelled).length,allCn.length-allCn.filter(s=>s.cancelled).length]);
 // 3B
 const T=(arr,f)=>r2(arr.reduce((s,d)=>s+d.lines.filter(f).reduce((a,l)=>a+0,0),0));

 const out=minus(agg(sales,l=>l.gst>0),agg(cns,l=>l.gst>0)),nil=minus(agg(sales,l=>l.gst==0),agg(cns,l=>l.gst==0));
 const itc=minus(agg(purch.filter(p=>p.party.gstin),()=>true),agg(dns.filter(p=>p.party.gstin),()=>true));const ex=expenseITC(REP.from,REP.to);itc.igst=r2(itc.igst+ex.igst);itc.cgst=r2(itc.cgst+ex.cgst);itc.sgst=r2(itc.sgst+ex.sgst);
 const inter32={};for(const s of sales)if(!s.party.gstin&&s.inter){const k=s.pos;inter32[k]=inter32[k]||{taxable:0,igst:0};for(const l of s.lines){inter32[k].taxable+=l.taxable;inter32[k].igst+=l.igst}}
 for(const r of cns)if(!r.party.gstin&&r.inter&&inter32[r.pos]){for(const l of r.lines){inter32[r.pos].taxable-=l.taxable;inter32[r.pos].igst-=l.igst}}
 return{sales,cns,purch,dns,b2b,b2cl,b2cs:Object.values(b2cs).map(o=>['OE',stName(o.pos),o.rate,r2(o.taxable),r2(o.igst),r2(o.cgst),r2(o.sgst),0]),cdnr,cdnur,
  hsn:Object.values(hsn).sort((a,b)=>a.typ.localeCompare(b.typ)||a.hsn.localeCompare(b.hsn)).map(h=>[h.typ,h.hsn,h.desc,h.uqc,r3(h.qty),r2(h.val),h.rate,r2(h.taxable),r2(h.igst),r2(h.cgst),r2(h.sgst),0]),docs,out,nil,itc,inter32}}
function utilise(o,c){o={...o};c={...c};const use=(ck,ok)=>{const u=Math.min(c[ck],o[ok]);c[ck]=r2(c[ck]-u);o[ok]=r2(o[ok]-u)};
 use('igst','igst');use('igst','cgst');use('igst','sgst');use('cgst','cgst');use('cgst','igst');use('sgst','sgst');use('sgst','igst');return{pay:o,carry:c}}

/* ================= MONEY: margins, payments, bank, expenses, profit ================= */
const PAYMODES=['Cash','UPI','Cheque','Demand draft','NEFT/RTGS/IMPS','Card','Credit (to be paid)'];
const RMODES=PAYMODES.filter(m=>!/^Credit/.test(m));
function unitCostNow(itemId){const st=stock(),t=today();let q=0,v=0;for(const b of S.batches)if(b.itemId===itemId&&(!b.exp||b.exp>=t)){const bq=st.b[b.id]||0;if(bq>0&&b.cost){q+=bq;v+=bq*b.cost}}return q?r2(v/q):itemCost(itemId)}
function lineMargin(l){if(!l.itemId||!(+l.rate))return null;const c=unitCostNow(l.itemId);if(!c)return null;const net=l.rate*(1-(+l.disc||0)/100);return r2((net-c)/c*100)}
function marginBox(ls){let rev=0,cost=0;for(const l of ls){if(!l.itemId)continue;rev+=l.taxable||0;cost+=(+l.qty||0)*unitCostNow(l.itemId)}if(!rev)return '';const p=rev-cost;
 return `<div class="tot mut" style="font-size:13px;margin-top:6px"><div><span>Your cost (not printed)</span><span>${money(cost)}</span></div><div><span>Profit on this invoice</span><b class="${p>=0?'up':'dn'}">${money(p)} (${r2(p/rev*100)}% of sale)</b></div></div>`}

function postReceipt(d){const id=uid();const cheque=/Cheque|Demand/.test(d.mode);
 const r={id,no:nextNo('RCP',d.date),date:d.date,customerId:d.customerId||'',partyName:d.partyName||((byId(S.customers,d.customerId)||{}).name)||'Cash customer',mode:d.mode,ref:d.ref||'',bank:d.bank||'',amount:r2(d.amount),allocs:[],status:cheque&&!d.bankTxnId?'Awaiting clearance':'Received',bankTxnId:d.bankTxnId||'',auto:!!d.auto,notes:d.notes||'',cancelled:false};
 if(d.allocs)r.allocs=d.allocs.filter(a=>a.amt>0).map(a=>({saleId:a.saleId,amt:r2(a.amt)}));else{let rem=r.amount;for(const s of openInvoices(r.customerId)){if(rem<=0)break;const amt=Math.min(rem,outstanding(s));if(amt>0){r.allocs.push({saleId:s.id,amt:r2(amt)});rem=r2(rem-amt)}}}
 S.receipts.push(r);if(d.bankTxnId){const t=byId(S.bankTxns,d.bankTxnId);if(t){t.status='matched';t.link={type:'receipt',id}}}return r}
const liveRcp=()=>S.receipts.filter(r=>!r.cancelled&&r.status!=='Bounced');
function paidOn(saleId){return r2(liveRcp().reduce((a,r)=>a+r.allocs.filter(x=>x.saleId===saleId).reduce((b,x)=>b+x.amt,0),0))}
function outstanding(s){if(s.cancelled)return 0;const cn=S.salesReturns.filter(r=>!r.cancelled&&r.invoiceId===s.id).reduce((a,r)=>a+r.total,0);return Math.max(0,r2(s.total-cn-paidOn(s.id)))}
function openInvoices(custId){return S.sales.filter(s=>!s.cancelled&&(custId===undefined||s.customerId===custId)&&outstanding(s)>0.009).sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no))}
function totalDues(){return r2(openInvoices().reduce((a,s)=>a+outstanding(s),0))}
function pendingCheques(){return S.receipts.filter(r=>!r.cancelled&&r.status==='Awaiting clearance')}
function unallocated(r){return r2(r.amount-r.allocs.reduce((a,x)=>a+x.amt,0))}
function moneyAlerts(out){const t=today();for(const r of pendingCheques()){const d=Math.floor((new Date(t)-new Date(r.date))/864e5);if(d>=4)out.push({lvl:'amber',type:'Cheque not cleared',text:`${r.mode} ${r.ref} from ${r.partyName} for ${money0(r.amount)} received ${d} days ago is not yet seen in the bank.`,btn:['Payments',"TAB.pay='rcp';go('payments')"]})}
 for(const s of openInvoices()){const c=byId(S.customers,s.customerId);const days=(c&&+c.creditDays)||30;const age=Math.floor((new Date(t)-new Date(s.date))/864e5);if(age>days)out.push({lvl:'amber',type:'Payment overdue',text:`${s.no} · ${s.party.name}: ${money0(outstanding(s))} unpaid for ${age} days.`,btn:['Record payment',`newReceipt('${s.customerId}')`]})}
 const unm=S.bankTxns.filter(x=>x.status==='unmatched').length;if(unm)out.push({lvl:'grey',type:'Bank entries',text:`${unm} bank statement line(s) not yet matched.`,btn:['Review',"go('bank')"]})}

 if(tab==='due'){const inv=openInvoices();const ag=[0,0,0,0];inv.forEach(s=>{const a=Math.floor((new Date(t)-new Date(s.date))/864e5);ag[a<=30?0:a<=60?1:a<=90?2:3]+=outstanding(s)});

  <div class="card scroll"><table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="n">Invoice total</th><th class="n">Received</th><th class="n">Balance due</th><th class="n">Age</th><th></th></tr>${inv.map(s=>{const a=Math.floor((new Date(t)-new Date(s.date))/864e5);return `<tr><td>${esc(s.no)}</td><td>${dmy(s.date)}</td><td>${esc(s.party.name)}</td><td class="n">${f2(s.total)}</td><td class="n">${f2(paidOn(s.id))}</td><td class="n"><b>${f2(outstanding(s))}</b></td><td class="n">${a} days</td><td><button class="btn s" onclick="newReceipt('${s.customerId}','${s.id}')">Record payment</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mut">Nothing to collect. All invoices are paid.</td></tr>'}</table></div>`}
 if(tab==='rcp')return top+`<div class="card scroll"><input placeholder="Search…" oninput="filt(this,'tR')" style="max-width:420px;margin-bottom:8px"><table id="tR"><tr><th>Receipt</th><th>Date</th><th>From</th><th>Mode</th><th>Reference</th><th class="n">Amount</th><th>Against</th><th>Status</th><th></th></tr>${[...S.receipts].reverse().map(r=>`<tr><td>${esc(r.no)}</td><td>${dmy(r.date)}</td><td>${esc(r.partyName)}</td><td>${esc(r.mode)}</td><td>${esc(r.ref)}${r.bank?' · '+esc(r.bank):''}</td><td class="n"><b>${f2(r.amount)}</b></td><td>${r.allocs.map(a=>esc((byId(S.sales,a.saleId)||{}).no)+' ('+f2(a.amt)+')').join('<br>')}${unallocated(r)>0.009?`<div class="mut">Advance: ${f2(unallocated(r))}</div>`:''}</td>
  <td>${r.cancelled?pill('Cancelled','grey'):r.status==='Bounced'?pill('Bounced','red'):r.status==='Awaiting clearance'?pill('Awaiting clearance','amber'):pill(r.bankTxnId?'In bank ✓':'Received','green')}</td>
  <td style="white-space:nowrap">${!r.cancelled&&r.status==='Awaiting clearance'?`<button class="btn s" onclick="setRcp('${r.id}','Received')">Cleared</button><button class="btn s o" onclick="setRcp('${r.id}','Bounced')">Bounced</button>`:''}${attBtn('receipt',r.id)}${r.cancelled?'':`<button class="btn s o" onclick="cancelRcp('${r.id}')">Cancel</button>`}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">No payments recorded.</td></tr>'}</table></div>`;
 const bal={};for(const s of S.sales.filter(s=>!s.cancelled)){const k=s.customerId||'_walk';bal[k]=bal[k]||{name:s.customerId?s.party.name:'Walk-in customers',billed:0,ret:0,paid:0};bal[k].billed+=s.total}
 for(const r of S.salesReturns.filter(r=>!r.cancelled)){const s=byId(S.sales,r.invoiceId);const k=(s&&s.customerId)||'_walk';if(bal[k])bal[k].ret+=r.total}
 for(const r of liveRcp()){const k=r.customerId||'_walk';bal[k]=bal[k]||{name:r.partyName,billed:0,ret:0,paid:0};bal[k].paid+=r.amount}
 return top+`<div class="card scroll"><table><tr><th>Customer</th><th class="n">Billed</th><th class="n">Returns</th><th class="n">Received</th><th class="n">Balance</th></tr>${Object.values(bal).sort((a,b)=>(b.billed-b.ret-b.paid)-(a.billed-a.ret-a.paid)).map(b=>{const x=r2(b.billed-b.ret-b.paid);return `<tr><td>${esc(b.name)}</td><td class="n">${f2(b.billed)}</td><td class="n">${f2(b.ret)}</td><td class="n">${f2(b.paid)}</td><td class="n"><b class="${x>0?'dn':''}">${f2(x)}</b>${x<0?' <span class="mut">advance</span>':''}</td></tr>`}).join('')}</table></div>`};
function newReceipt(custId,saleId,pre){PAGE='payments';custId=custId||'';D={kind:'rcp',date:today(),customerId:custId,partyName:'',mode:'UPI',ref:'',bank:'',amount:0,auto:true,alloc:{},bankTxnId:'',...(pre||{})};
 if(saleId){D.auto=false;const s=byId(S.sales,saleId);D.alloc[saleId]=outstanding(s);if(!D.amount)D.amount=outstanding(s);if(!custId)D.partyName=s.party.name}else if(custId&&!D.amount)D.amount=r2(openInvoices(custId).reduce((a,s)=>a+outstanding(s),0));render()}

 return head('Record payment received')+(bt?`<div class="banner">From bank statement: ${dmy(bt.date)} · ${esc(bt.desc)} · ${money(bt.credit)}</div>`:'')+`<div class="card"><div class="f"><div><label>Date received</label><input type="date" value="${D.date}" onchange="D.date=this.value"></div>
 <div><label>Customer</label><select onchange="D.customerId=this.value;D.alloc={};D.auto=true;D.amount=D.amount||r2(openInvoices(this.value).reduce((a,s)=>a+outstanding(s),0));render()">${opt('','Walk-in / other',D.customerId)}${S.customers.map(c=>opt(c.id,c.name,D.customerId)).join('')}</select></div>
 ${D.customerId?'':`<div><label>Received from</label><input value="${esc(D.partyName)}" oninput="D.partyName=this.value"></div>`}

 ${D.mode==='Cash'?'':`<div><label>${D.mode==='UPI'?'UPI transaction ref':D.mode==='Cheque'?'Cheque number':D.mode==='Demand draft'?'DD number':'UTR / reference'}</label><input value="${esc(D.ref)}" oninput="D.ref=this.value"></div>`}

async function shrink(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<700000)return f;try{const bm=await createImageBitmap(f);const k=Math.min(1,1800/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}

let ATTBUSY=false;async function attFlush(){if(ATTBUSY||!syncOn()||!navigator.onLine)return;ATTBUSY=true;let ch=false;try{for(const a of S.attachments||[]){if(a.kind!=='file'||a.cloud||a.deleted)continue;const b=await idbGet('file:'+a.id);if(!b)continue;

const LK={locked:false,cur:null,reset:false,forgot:false,chg:false,err:'',shown:null};
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const TKEY=DBNAME+'-trust2',BKEY=DBNAME+'-bio2';
async function lkHash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},k,256))}
async function lkMark(u){return b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.hash+'|'+u.id+'|trusted')))}
const lkUsers=()=>S.settings.users||[],lkOn=()=>lkUsers().some(u=>u.active!==false),isAdmin=()=>!lkOn()||(LK.cur&&LK.cur.role==='Admin');
async function lkCheck(){if(S.settings.login&&S.settings.login.hash&&!S.settings.users){const L=S.settings.login;S.settings.users=[{id:uid(),user:L.user,salt:L.salt,hash:L.hash,role:'Admin',active:true}];delete S.settings.login;persist()}
 if(!lkOn()){LK.locked=false;LK.cur=null;return false}
 for(const st of[sessionStorage,localStorage]){let t=null;try{t=JSON.parse(st.getItem(TKEY)||'null')}catch(e){}if(!t)continue;const u=lkUsers().find(x=>x.id===t.uid&&x.active!==false);if(u&&t.mark===await lkMark(u)){LK.cur=u;LK.locked=false;LK.chg=!!u.mustChange;return false}}
 LK.cur=null;LK.locked=true;return true}
async function lkTrust(u,remember){const t=JSON.stringify({uid:u.id,mark:await lkMark(u)});if(remember)localStorage.setItem(TKEY,t);sessionStorage.setItem(TKEY,t);LK.cur=u;LK.locked=false;LK.err='';LK.forgot=false;LK.chg=!!u.mustChange}
const bioOK=()=>!!(window.PublicKeyCredential&&window.isSecureContext&&location.protocol==='https:');
const bioGet=()=>{try{return JSON.parse(localStorage.getItem(BKEY)||'null')}catch(e){return null}};
function genPw(){const c='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';return [...crypto.getRandomValues(new Uint8Array(8))].map(x=>c[x%c.length]).join('')}
function lockHTML(){const logo=S.settings.logo?`<img src="${S.settings.logo}" alt="logo" style="max-height:70px;max-width:220px;display:block;margin:0 auto 10px;background:#fff;border-radius:8px;padding:6px">`:'';const bio=bioGet();

 if(LK.chg)return top+`<p style="font-size:14px">Welcome, <b>${esc(LK.cur.user)}</b>. Please choose your own password to continue.</p><label>New password (6+ characters)</label><input id="lkC1" type="password" autocomplete="new-password"><label style="margin-top:8px">New password again</label><input id="lkC2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')lkChange()"><div class="dn" style="font-size:13px;margin:6px 0">${esc(LK.err)}</div><button class="btn" style="width:100%" onclick="lkChange()">Save and continue</button></div>`;
 if(LK.forgot)return top+`<p style="font-size:13.5px">Sign in with the cloud sync email and password. This opens GingerBooks as the administrator, who can then reset any password under Settings → Users.</p><label>Cloud email</label><input id="lkCe" type="email" autocomplete="username"><label style="margin-top:8px">Cloud password</label><input id="lkCp" type="password" onkeydown="if(event.key==='Enter')lkForgot()"><div class="dn" style="font-size:13px;margin:6px 0">${esc(LK.err)}</div><button class="btn" style="width:100%" onclick="lkForgot()">Unlock with cloud account</button><button class="btn o s" style="width:100%;margin-top:6px" onclick="LK.forgot=false;LK.err='';render()">Back</button></div>`;
 return top+`<label>User name</label><input id="lkU" autocomplete="username"><label style="margin-top:8px">Password</label><input id="lkP" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')lkLogin()">

 ${bio&&bioOK()&&lkUsers().some(u=>u.id===bio.uid&&u.active!==false)?`<button class="btn o" style="width:100%;margin-top:6px" onclick="lkBio()">Unlock with fingerprint / face</button>`:''}
 <div style="text-align:center;margin-top:10px;font-size:13px">Forgot your password? Ask the administrator to reset it.${SY.cfg.url&&SY.cfg.key?`<br><a href="#" onclick="LK.forgot=true;LK.err='';render();return false">Administrator: unlock with cloud account</a>`:''}</div></div>`}
async function lkLogin(){const n=document.getElementById('lkU').value.trim().toLowerCase(),p=document.getElementById('lkP').value;const u=lkUsers().find(x=>x.user.toLowerCase()===n&&x.active!==false);
 if(!u||(await lkHash(p,u.salt))!==u.hash){LK.err='User name or password is wrong.';render();return}u.lastLogin=Date.now();await lkTrust(u,document.getElementById('lkR').checked);persist();render()}
async function lkChange(){const a=document.getElementById('lkC1').value,b=document.getElementById('lkC2').value;if(a.length<6){LK.err='Use at least 6 characters.';return render()}if(a!==b){LK.err='The two passwords do not match.';return render()}
 const u=LK.cur;u.salt=b64(crypto.getRandomValues(new Uint8Array(16)));u.hash=await lkHash(a,u.salt);delete u.mustChange;await lkTrust(u,!!localStorage.getItem(TKEY));LK.chg=false;await persist();render();toast('Password saved.')}

async function lkFirst(){const v=id=>(document.getElementById(id)||{}).value||'';const n=v('lkNu').trim(),p=v('lkNp');if(!n)return toast('Enter a user name.');if(p.length<6)return toast('Use at least 6 characters for the password.');if(p!==v('lkNp2'))return toast('The two passwords do not match.');
 const u={id:uid(),user:n,role:'Admin',active:true,created:today()};await lkSetHash(u,p);S.settings.users=[u];await lkTrust(u,true);await persist();render();toast('Login turned on. You are the administrator.',5000)}

function lkMail(){const x=LK.shown;const link=location.protocol==='https:'?location.origin+location.pathname:'https://vpprasanth.github.io/gingerbooks/';
 const body=`Dear ${x.full||x.user},\n\n${x.reset?'Your GingerBooks password has been reset.':'A GingerBooks login has been created for you.'}\n\nOpen: ${link}\nUser name: ${x.user}\nTemporary password: ${x.pw}\n\nYou will be asked to choose your own password when you log in. Please do not share it.\n\n${LK.cur.full||LK.cur.user}\n${S.settings.name||''}`;

async function lkRename(id,n){n=(n||'').trim();const u=lkUsers().find(x=>x.id===id);if(!n||n===u.user)return render();if(!/^[\w.@-]{3,30}$/.test(n)){toast('Use 3 to 30 letters, numbers, dots, dashes or @.');return render()}if(lkUsers().some(x=>x.id!==id&&x.user.toLowerCase()===n.toLowerCase())){toast('That user name is already taken.');return render()}u.user=n;await persist();render();toast('User name changed to '+n+'.')}
