<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GingerBooks</title><meta name="theme-color" content="#0b3b37"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GingerBooks"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>.ghelp{font-size:13px;font-weight:600;color:var(--g);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:2px 9px;background:#fff;white-space:nowrap}.ghelp:hover{background:var(--soft)}

:root{--g:#0f766e;--gd:#115e59;--bg:#f4f8ef;--card:#fff;--line:#dce8dd;--txt:#1b2b25;--mut:#5b6e64;--red:#c0392b;--amb:#b7791f;--grn:#3d8b1f;--y:#f2c230;--leaf:#7cb342;--soft:#eef6e8}
*{box-sizing:border-box}
a{color:var(--g)}
body.ro button[onclick*="cancel" i],body.ro button[onclick*="del" i],body.ro button[onclick^="new"],body.ro button[onclick*="edit" i],body.ro button[onclick*="save" i],body.ro button[onclick*="close" i]:not([onclick*="attClose"]),body.ro button[onclick*="setRcp"],body.ro button[onclick*="saleFrom"],body.ro button[onclick*="Repeat" i],body.ro button[onclick*="newExpense"],body.ro button[onclick*="match" i],body.ro button[onclick*="post" i],body.ro button[onclick*="write" i],body.ro button[onclick*="adj" i],body.ro label.btn,body.ro #modal textarea,body.ro #modal .f,body.ro #modal button[onclick*="attAddNote"],body.ro input[type=file],body.ro .alert button:not([onclick*="guestOut"]){display:none!important}
body.ro button[onclick^="csv("],body.ro button[onclick^="dl"],body.ro button[onclick*="print" i]{display:revert!important}
#modal{position:fixed;inset:0;background:rgba(10,40,36,.45);display:none;align-items:flex-start;justify-content:center;z-index:8;padding:5vh 12px;overflow:auto}.mbox{background:#fff;border-radius:14px;padding:16px 18px;width:100%;max-width:720px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.attrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.attth{width:54px;height:54px;object-fit:cover;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.link{cursor:pointer;transition:border-color .15s,box-shadow .15s}.link:hover{border-color:var(--g);box-shadow:0 2px 8px rgba(15,118,110,.15)}.more{float:right;font-size:12.5px;font-weight:500;color:var(--g);cursor:pointer;text-decoration:none}.more:hover{text-decoration:underline}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;min-height:100vh}
#nav{width:225px;background:linear-gradient(180deg,#0b3b37 0%,#0f4f47 60%,#1d5e3a 100%);color:#e6f2ec;padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
#nav .brand{font-weight:700;font-size:17px;padding:6px 10px 2px;color:var(--y)}
#nav .biz{font-size:12px;padding:0 10px 12px;color:#a9c9bd}
#nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;user-select:none}
#nav a:hover{background:rgba(255,255,255,.09)}#nav a.on{background:linear-gradient(90deg,var(--leaf),#4f9a3a);color:#fff;box-shadow:inset 3px 0 0 var(--y)}
#nav .sep{border-top:1px solid rgba(255,255,255,.14);margin:8px 4px}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
main{flex:1;padding:20px 26px;max-width:1280px;min-width:0}
h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{color:var(--mut);font-size:13px}.kpi .s{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mut);font-weight:600;background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap}
.btn{display:inline-block;border:1px solid var(--g);background:var(--g);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;margin:2px;font-family:inherit}
.btn:hover{filter:brightness(.95)}.btn.o{background:#fff;color:var(--gd)}.btn.s{padding:4px 9px;font-size:13px}.btn.r{background:var(--red);border-color:var(--red);color:#fff}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid #c7d8cb;border-radius:7px;background:#fff;width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.f{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:8px}
.lines td{padding:4px;border-bottom:none}.lines input,.lines select{padding:6px}
.tot{margin-left:auto;max-width:360px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:19px;font-weight:700;border-top:2px solid var(--txt);margin-top:4px;padding-top:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eee;white-space:nowrap}
.pill.red{background:#fadbd8;color:var(--red)}.pill.amber{background:#fdebd0;color:#9c640c}.pill.green{background:#d5f5e3;color:var(--grn)}.pill.grey{background:#eee;color:#555}
.alert{padding:9px 12px;border-left:4px solid;border-radius:6px;margin:6px 0;background:#fff;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alert.red{border-left-color:var(--red)}.alert.amber{border-left-color:var(--amb)}.alert.grey{border-left-color:#999}
.alert b{min-width:130px}
.mut{color:var(--mut)}.up{color:var(--grn)}.dn{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:6px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;background:#fff}
.tabs a.on{background:var(--g);color:#fff;border-color:var(--g)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
#toast{position:fixed;bottom:20px;right:20px;background:#0b3b37;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10;max-width:420px}
.banner{background:#fdebd0;border:1px solid #f5cba7;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.banner.red{background:#fadbd8;border-color:#f1948a}
.scroll{overflow-x:auto}
.bar{fill:var(--g)}.bar:hover{fill:var(--gd)}
.hbar{height:8px;background:#f3e3cf;border-radius:4px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--g)}
#print{display:none}
@media print{#app,#toast,#modal{display:none!important}#print{display:block}body{background:#fff}}
.mtop,.tabbar{display:none}
.cb{position:relative;display:block}.cb::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:#557}.cb .cbi{padding-right:26px;cursor:text;width:100%;box-sizing:border-box}
.cbl{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:auto;font-size:14px}.cbl div{padding:8px 11px;cursor:pointer;border-bottom:1px solid #f1f4f2}.cbl div.on,.cbl div:hover{background:#e3f3ee}.cbl div.sel{font-weight:700;color:var(--g)}
@media(max-width:820px){#app{flex-direction:column}#nav{width:auto;height:auto;position:sticky;top:0;z-index:7;padding:0;overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#nav .mtop{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:52px}#nav .mtop .mb{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;font-size:20px;line-height:1;padding:6px 10px;cursor:pointer}#nav .mtop .mt{font-weight:700;color:var(--y);font-size:17px;white-space:nowrap}#nav .mtop .pg{flex:1;min-width:0;font-size:13px;color:#cfe5dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .nlinks{display:none}body.navopen #nav .nlinks{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;overflow:auto;background:linear-gradient(180deg,#0b3b37 0%,#0f4f47 60%,#1d5e3a 100%);padding:8px 12px 90px;z-index:8}body.navopen{overflow:hidden}
#nav .nlinks a{padding:11px 10px;font-size:16px}
#nav .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#0b3b37;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:9;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
#nav .tabbar a{flex:1;flex-direction:column;gap:1px;font-size:11px;padding:5px 2px;text-align:center;justify-content:center}#nav .tabbar a span{font-size:20px}#nav .tabbar a.on{background:rgba(255,255,255,.14)}
main{padding:12px 12px 86px}.grid2{grid-template-columns:1fr}.f{grid-template-columns:1fr 1fr}h1{font-size:21px}.mbox{padding:12px}#toast{bottom:76px!important}}
@media(max-width:480px){.f{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
.inv{font:11px/1.35 Arial,Helvetica,sans-serif;color:#000}
.inv table{border-collapse:collapse;width:100%}
.inv td,.inv th{border:1px solid #000;padding:3px 5px;background:none;color:#000;font-size:10.5px}
.inv th{font-weight:bold;text-align:center}
.inv .t{font-size:16px;font-weight:bold;text-align:center;letter-spacing:1px}
.inv .nb td{border:none}
.inv .n{text-align:right}
@page{size:A4;margin:10mm}
</style>
</head>

/* ---------- helpers ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+(+n||0));return ymd(x)}
const dmy=d=>d?d.slice(8,10)+'-'+d.slice(5,7)+'-'+d.slice(0,4):'';
const r2=n=>Math.round(((+n||0)+Number.EPSILON)*100)/100;
const r3=n=>Math.round(((+n||0)+Number.EPSILON)*1000)/1000;
const f2=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>(+n<0?'−₹'+f2(-n):'₹'+f2(n));
const money0=n=>{const v=Math.round(+n||0);return (v<0?'−₹':'₹')+Math.abs(v).toLocaleString('en-IN')};
const qf=n=>(+n||0).toLocaleString('en-IN',{maximumFractionDigits:3});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(a,id)=>a.find(x=>x.id===id);
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(l)}</option>`;
const stName=c=>c?c+'-'+(STATES[c]||''):'';
function fy(date){const y=+date.slice(0,4),m=+date.slice(5,7);const s=m>=4?y:y-1;return s+'-'+pad((s+1)%100)}
function fyStart(date){const y=+date.slice(0,4),m=+date.slice(5,7);return (m>=4?y:y-1)+'-04-01'}
function nextNo(prefix,date){const k=prefix+'/'+fy(date);S.counters[k]=(S.counters[k]||0)+1;return k+'/'+String(S.counters[k]).padStart(4,'0')}
function gstinValid(g){if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return false;return gstinCheck(g.slice(0,14))===g[14]}
function gstinCheck(p){const cs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';let sum=0;for(let i=0;i<14;i++){const v=cs.indexOf(p[i])*(i%2?2:1);sum+=Math.floor(v/36)+v%36}return cs[(36-sum%36)%36]}
function words(n){const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+two(x%100);
 let r='';const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1000);n%=1000;
 if(cr)r+=three(cr)+' Crore ';if(l)r+=two(l)+' Lakh ';if(th)r+=two(th)+' Thousand ';if(n)r+=three(n);return r.trim()||'Zero'}
function amountWords(x){x=Math.abs(+x||0);const rs=Math.floor(x),p=Math.round((x-rs)*100);return 'Rupees '+words(rs)+(p?' and '+words(p)+' Paise':'')+' Only'}
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms||2600)}
function filt(inp,tid){const q=inp.value.toLowerCase();document.querySelectorAll('#'+tid+' tr').forEach((tr,i)=>{if(i)tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}
function download(fn,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function csvText(h,rows){const q=v=>{v=v==null?'':String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [h,...rows].map(r=>r.map(q).join(',')).join('\r\n')}
function csv(name,h,rows){download(name.replace(/[^\w\-]+/g,'_')+'.csv','\ufeff'+csvText(h,rows),'text/csv;charset=utf-8')}

const DBNAME='gingerbooks',STORE='kv';
let S=null,FH=null,AUTO_NEEDS=false;
function blank(){return{version:1,settings:{name:'',address:'',gstin:'',state:'',phone:'',email:'',bank:'',fssai:'',terms:'Goods once sold are taken back only as per our return policy. Subject to local jurisdiction.',expiryWarnDays:30,b2clLimit:100000,backupDays:7,monthTarget:0,elecRate:8,logo:DEFAULT_LOGO},
 items:[],customers:[],suppliers:[],batches:[],moves:[],purchases:[],sales:[],salesReturns:[],purchaseReturns:[],orders:[],production:[],adjustments:[],receipts:[],expenses:[],bankTxns:[],vendors:[],workers:[],attachments:[],payroll:[],audit:[],counters:{},lastBackup:null,created:today()}}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function persist(){if(GM.on){roBlock();return}const data=JSON.stringify(S);if(typeof syncAfterCommit==='function'&&syncOn())syncAfterCommit();try{await idbPut('state',data)}catch(e){try{localStorage.setItem(DBNAME,data)}catch(e2){toast('Could not save! Download a backup now.',8000)}}
 clearTimeout(persist.t);persist.t=setTimeout(writeFH,1500)}

async function writeFH(){if(!FH)return;try{if((await FH.queryPermission({mode:'readwrite'}))!=='granted'){AUTO_NEEDS=true;return}
 const w=await FH.createWritable();await w.write(JSON.stringify(S,null,0));await w.close();AUTO_NEEDS=false;localStorage.setItem(DBNAME+'-auto',new Date().toISOString())}catch(e){AUTO_NEEDS=true}}
async function pickBackupFile(){try{FH=await window.showSaveFilePicker({suggestedName:'GingerBooks-autobackup.json',types:[{description:'GingerBooks backup',accept:{'application/json':['.json']}}]});await idbPut('fh',FH);await writeFH();render();toast('Auto-backup is ON. Every change is copied to that file.')}catch(e){}}
async function reconnectFH(){try{if(FH&&(await FH.requestPermission({mode:'readwrite'}))==='granted'){await writeFH();render();toast('Auto-backup reconnected')}}catch(e){}}
async function stopAuto(){FH=null;await idbPut('fh',null);render()}

/* ---------- stock engine ---------- */
let STK=null;
function stock(){if(STK)return STK;const b={},it={};for(const m of S.moves){if(m.batchId)b[m.batchId]=r3((b[m.batchId]||0)+m.qty);it[m.itemId]=r3((it[m.itemId]||0)+m.qty)}return STK={b,it}}
function addMove(itemId,batchId,qty,type,refId,date){S.moves.push({id:uid(),itemId,batchId:batchId||null,qty:r3(qty),type,refId,date});STK=null}
function removeMoves(refId){S.moves=S.moves.filter(m=>m.refId!==refId);STK=null}
function getBatch(itemId,no,mfg,exp,cost){no=(no||'').trim()||autoBatch(mfg||today());let b=S.batches.find(x=>x.itemId===itemId&&x.no.toLowerCase()===no.toLowerCase());
 if(!b){b={id:uid(),itemId,no,mfg:mfg||'',exp:exp||'',cost:+cost||0,closed:false};S.batches.push(b)}else{if(exp&&!b.exp)b.exp=exp;if(mfg&&!b.mfg)b.mfg=mfg;if(cost&&!b.cost)b.cost=+cost;b.closed=false}return b}
const autoBatch=d=>'B'+d.slice(2,4)+d.slice(5,7)+d.slice(8,10);
function available(itemId){const st=stock(),t=today();return r3(S.batches.filter(b=>b.itemId===itemId&&(!b.exp||b.exp>=t)).reduce((s,b)=>s+Math.max(0,st.b[b.id]||0),0))}
function allocate(itemId,qty,simB){const t=today();const bs=S.batches.filter(b=>b.itemId===itemId&&(!b.exp||b.exp>=t)&&(simB[b.id]||0)>0).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||a.no.localeCompare(b.no));
 const out=[];let rem=r3(qty);for(const b of bs){if(rem<=0)break;const take=Math.min(rem,simB[b.id]);out.push({batchId:b.id,qty:r3(take)});simB[b.id]=r3(simB[b.id]-take);rem=r3(rem-take)}
 if(rem>0)out.push({batchId:null,qty:rem,short:true});return out}
function batchText(alloc){return alloc.map(a=>{const b=byId(S.batches,a.batchId);return b?b.no+(b.exp?' (exp '+dmy(b.exp)+')':'')+(alloc.length>1?' × '+qf(a.qty):''):'no stock'+(alloc.length>1?' × '+qf(a.qty):'')}).join(', ')}
function itemCost(itemId){const it=byId(S.items,itemId);return +(it&&it.cost)||0}
function stockValue(){const st=stock();let v=0;for(const b of S.batches){const q=st.b[b.id]||0;if(q>0)v+=q*(b.cost||itemCost(b.itemId))}return v}

/* ---------- tax ---------- */
function calcLines(lines,inter){const t={taxable:0,cgst:0,sgst:0,igst:0};
 for(const l of lines){const it=byId(S.items,l.itemId);if(it){l.name=l.name||it.name;l.hsn=l.hsn||it.hsn||'';l.unit=l.unit||it.unit||''}
  l.taxable=r2((+l.qty||0)*(+l.rate||0)*(1-(+l.disc||0)/100));const tax=r2(l.taxable*(+l.gst||0)/100);
  if(inter){l.igst=tax;l.cgst=0;l.sgst=0}else{l.cgst=r2(tax/2);l.sgst=r2(tax-l.cgst);l.igst=0}
  l.total=r2(l.taxable+tax);t.taxable+=l.taxable;t.cgst+=l.cgst;t.sgst+=l.sgst;t.igst+=l.igst}
 for(const k in t)t[k]=r2(t[k]);t.gross=r2(t.taxable+t.cgst+t.sgst+t.igst);t.total=Math.round(t.gross);t.roundOff=r2(t.total-t.gross);return t}
function partyOf(coll,id,fallbackState,name){const c=byId(S[coll],id);return c?{name:c.name,gstin:(c.gstin||'').toUpperCase(),state:c.state||fallbackState,address:c.address||'',phone:c.phone||''}:{name:name||'Cash customer',gstin:'',state:fallbackState,address:'',phone:''}}

/* ---------- posting (the single source of truth for every transaction) ---------- */
function postSale(d){const st=stock();const simB={...st.b};const inter=d.pos!==S.settings.state;
 const lines=d.lines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,batchSel:l.batchSel||'auto',qty:+l.qty,rate:+l.rate,disc:+l.disc||0,gst:+l.gst}));const noStk=!!(d.past&&d.noStock);
 for(const l of lines){if(noStk){l.alloc=[];l.batchText='';l.cost=unitCostNow(l.itemId);continue}if(l.batchSel!=='auto'){l.alloc=[{batchId:l.batchSel,qty:l.qty}];simB[l.batchSel]=r3((simB[l.batchSel]||0)-l.qty)}else l.alloc=allocate(l.itemId,l.qty,simB);l.batchText=batchText(l.alloc);
  l.cost=r2(l.alloc.reduce((a,x)=>{const b=byId(S.batches,x.batchId);return a+x.qty*((b&&b.cost)||unitCostNow(l.itemId))},0)/l.qty)}
 const t=calcLines(lines,inter);const id=uid();
 const s={id,no:d.past&&d.manualNo?d.manualNo.trim():nextInv(d.date),past:!!d.past,date:d.date,customerId:d.customerId||'',party:partyOf('customers',d.customerId,d.pos,d.walkinName),pos:d.pos,inter,lines,...t,payMode:d.payMode||'Cash',payRef:d.payRef||'',orderId:d.orderId||'',notes:d.notes||'',cancelled:false,created:new Date().toISOString()};
 S.sales.push(s);if(s.past)bumpInvCounter(s.no,s.date);for(const l of lines)for(const a of l.alloc)addMove(l.itemId,a.batchId,-a.qty,'sale',id,d.date);
 if(s.payMode&&!/^Credit/.test(s.payMode)&&s.total>0)postReceipt({date:s.date,customerId:s.customerId,partyName:s.party.name,mode:s.payMode,ref:d.payRef||'',amount:s.total,allocs:[{saleId:s.id,amt:s.total}],auto:true});return s}
function postPurchase(d){const sup=byId(S.suppliers,d.supplierId);const sst=(sup&&sup.state)||S.settings.state;const inter=sst!==S.settings.state;
 const lines=d.lines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,batchNo:l.batchNo,mfg:l.mfg||'',exp:l.exp||'',qty:+l.qty,rate:+l.rate,disc:0,gst:+l.gst}));
 const t=calcLines(lines,inter);const id=uid();
 for(const l of lines){const b=getBatch(l.itemId,l.batchNo,l.mfg||d.date,l.exp,l.rate);l.batchId=b.id;l.batchNo=b.no;l.batchText=b.no+(b.exp?' (exp '+dmy(b.exp)+')':'')}
 const p={id,no:nextNo('PUR',d.date),date:d.date,supplierId:d.supplierId||'',party:partyOf('suppliers',d.supplierId,sst,'Unknown supplier'),supInvNo:d.supInvNo||'',supInvDate:d.supInvDate||d.date,inter,lines,...t,cancelled:false,created:new Date().toISOString()};
 S.purchases.push(p);for(const l of lines)addMove(l.itemId,l.batchId,l.qty,'purchase',id,d.date);supLearn(p);return p}
function returnedQty(coll,key,docId,idx){return S[coll].filter(r=>!r.cancelled&&r[key]===docId).reduce((s,r)=>s+r.lines.filter(l=>l.idx===idx).reduce((a,l)=>a+l.qty,0),0)}
function postSalesReturn(d){const inv=byId(S.sales,d.invoiceId);const lines=d.lines.filter(x=>+x.qty>0).map(x=>{const o=inv.lines[x.idx];const ab=(o.alloc||[]).find(a=>a.batchId);
  return{idx:x.idx,itemId:o.itemId,name:o.name,hsn:o.hsn,unit:o.unit,qty:+x.qty,rate:o.rate,disc:o.disc,gst:o.gst,batchId:ab?ab.batchId:null,batchText:ab?batchText([ab]):''}});

 const t=calcLines(lines,p.inter);const id=uid();
 const r={id,no:nextNo('DN',d.date),date:d.date,purchaseId:p.id,purchaseNo:p.no,supInvNo:p.supInvNo,supInvDate:p.supInvDate,party:p.party,pos:p.party.state,inter:p.inter,reason:d.reason||'',lines,...t,cancelled:false};

function postProduction(d){const it=byId(S.items,d.itemId);const exp=d.exp||(it&&it.shelfDays?addDays(d.date,it.shelfDays):'');const id=uid();
 const simB={...stock().b};const inputs=d.inputs.filter(x=>x.itemId&&+x.qty>0).map(x=>{const alloc=allocate(x.itemId,+x.qty,simB);return{itemId:x.itemId,qty:+x.qty,alloc}});
 let cost=0;for(const x of inputs)for(const a of x.alloc){const b=byId(S.batches,a.batchId);cost+=a.qty*((b&&b.cost)||itemCost(x.itemId))}

 const lab=r2(labour.reduce((a2,x)=>a2+x.amt,0)),elec=r2((+d.elecUnits||0)*(+d.elecRate||0)),fuel=r2(+d.fuel||0),oth=r2(+d.other||0);
 const costs={labour:lab,elec,elecUnits:+d.elecUnits||0,elecRate:+d.elecRate||0,fuel,other:oth,otherNote:d.otherNote||''};const lot=r2(cost+lab+elec+fuel+oth);
 const p={id,no:nextNo('PRD',d.date),date:d.date,itemId:d.itemId,qty:+d.qty,batchId:b.id,batchNo:b.no,exp:b.exp,inputs,unitCost,matCost:r2(cost),labour,costs,lotCost:lot,lotUnit:+d.qty?r2(lot/+d.qty):0,notes:d.notes||'',cancelled:false};
 if(d.payExp){const mk=(cat,amt,payee,desc)=>{if(amt>0){const e=postExpense({date:d.date,kind:'OpEx',category:cat,behaviour:'Variable',amount:amt,payee,desc,mode:'Cash'});e.prodId=id}};
  const cl=labour.filter(x=>(byId(S.workers,x.workerId)||{}).payType!=='Per month');mk('Labour charges (daily / piece rate)',r2(cl.reduce((a2,x)=>a2+x.amt,0)),cl.map(x=>x.name).join(', '),'Wages for production '+p.no+' ('+labour.length+' workers)');mk('Fuel / gas / firewood for cooking',fuel,'','Fuel for production '+p.no);mk('Production consumables (gloves, caps, cleaning)',oth,'',(d.otherNote||'Other costs')+' for production '+p.no)}

function newProduction(){const fin=S.items.filter(i=>i.type==='Finished');if(!fin.length){go('items');toast('Add a finished product first');return}PAGE='production';D={kind:'production',date:today(),itemId:fin[0].id,qty:0,batchNo:autoBatch(today()),exp:'',notes:'',inputs:[{itemId:'',qty:0}],wk:{},elecUnits:0,elecRate:S.settings.elecRate||8,fuel:0,other:0,otherNote:'',payExp:true};render()}
function dailyProd(n){const t=today(),MK=HEADS.filter(h=>h[1]==='make'&&!/Wastage|Depreciation/.test(h[0])).map(h=>h[0]),rc={};
 const mRate=m=>{if(rc[m]!=null)return rc[m];const [y,mo]=m.split('-').map(Number);const a=m+'-01',e=`${m}-${pad(new Date(y,mo,0).getDate())}`,b=e<t?e:t;
  const q=S.production.filter(p=>!p.cancelled&&p.date>=a&&p.date<=b).reduce((s2,p)=>s2+p.qty,0);
  const runE=S.production.some(p=>!p.cancelled&&p.date>=a&&p.date<=b&&p.costs&&p.costs.elec>0);const mst=S.production.filter(p=>!p.cancelled&&p.date>=a&&p.date<=b).reduce((s2,p)=>s2+(p.labour||[]).filter(l=>{const w=byId(S.workers,l.workerId);return w&&rateAt(w,p.date).payType==='Per month'}).reduce((s3,l)=>s3+(+l.amt||0),0),0);const fx=Math.max(0,S.expenses.filter(x=>!x.cancelled&&!x.prodId&&x.kind==='OpEx'&&(x.behaviour==='Fixed'||x.payId)&&x.date>=a&&x.date<=b&&MK.includes(headOfCat(x.category))&&!(runE&&x.category==='Electricity')).reduce((s2,x)=>s2+x.amount-(+x.payRun||0),0)-mst)+depreciation(a,b);
  return rc[m]=q?fx/q:0};
 const out=[];for(let i=0;i<n;i++){const d=addDays(t,-i);const runs=S.production.filter(p=>!p.cancelled&&p.date===d);const h={};let qty=0;const items={};
  for(const p of runs){qty+=p.qty;const it=byId(S.items,p.itemId)||{};items[it.name]=(items[it.name]||0)+p.qty;for(const x of p.inputs||[])for(const al of x.alloc||[]){const bt=byId(S.batches,al.batchId);const hd=headOfItem(x.itemId);h[hd]=(h[hd]||0)+al.qty*((bt&&bt.cost)||itemCost(x.itemId))}}
  const mat=Object.values(h).reduce((a2,b2)=>a2+b2,0);
  const dx=S.expenses.filter(x=>!x.cancelled&&!x.prodId&&x.kind==='OpEx'&&x.date===d&&x.behaviour!=='Fixed'&&!x.payId&&MK.includes(headOfCat(x.category)));for(const x of dx){const hd=headOfCat(x.category);h[hd]=(h[hd]||0)+x.amount}
  const rcst=runs.reduce((a2,p)=>a2+(p.costs?p.costs.labour+p.costs.elec+p.costs.fuel+p.costs.other:0),0);
  const direct=dx.reduce((a2,x)=>a2+x.amount,0)+rcst,over=qty*mRate(d.slice(0,7)),tot=mat+direct+over;
  let sq=0,sv=0;for(const sl of S.sales)if(!sl.cancelled&&sl.date===d)for(const l of sl.lines)if((byId(S.items,l.itemId)||{}).type==='Finished'){sq+=l.qty;sv+=l.taxable}
  if(runs.length||direct)out.push({d,runs:runs.length,qty,items,h,mat,direct,over,tot,pu:qty?tot/qty:null,sq,sp:sq?sv/sq:null})}
 return out}

 return `<div class="card scroll"><h2>Daily production cost (last ${n} days)${compact?'<a class="more" onclick="go(\'production\')">Details ›</a>':''}</h2>
 ${compact?'':`<div class="mut" style="font-size:13px;margin-bottom:6px">Materials = stock used in that day's production runs. Direct costs = that day's variable expenses under Procurement, Processing, Labour, Ingredients and Packaging. Fixed share = the month's fixed making costs (salaries, electricity, machine AMC, depreciation…) spread over every unit made that month. Click a date for the full cost breakdown.</div><div class="row" style="margin-bottom:6px">${[7,14,30,60].map(k=>`<button class="btn s ${n===k?'':'o'}" onclick="TAB.pd=${k};render()">${k} days</button>`).join('')}</div>`}
 <table><tr><th>Date</th><th>Made</th><th class="n">Materials</th><th class="n">Direct costs</th><th class="n">Fixed share</th><th class="n">Total cost</th><th class="n">Cost / unit</th><th class="n">Avg selling price</th><th class="n">Margin / unit</th></tr>
 ${rows.map(r=>`<tr class="link" onclick="PB={from:'${r.d}',to:'${r.d}'};WIF=null;go('profit')"><td><a>${dmy(r.d)}</a></td><td>${Object.entries(r.items).map(([k,v])=>esc(k)+' × '+qf(v)).join('<br>')||'<span class="mut">No production</span>'}</td><td class="n">${money0(r.mat)}</td><td class="n">${money0(r.direct)}</td><td class="n">${money0(r.over)}</td><td class="n"><b>${money0(r.tot)}</b></td><td class="n"><b>${pf(r.pu)}</b></td><td class="n">${pf(r.sp)}</td><td class="n ${r.pu!=null&&r.sp!=null?(r.sp-r.pu>=0?'up':'dn'):''}">${r.pu!=null&&r.sp!=null?f2(r.sp-r.pu):'-'}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">No production or making costs in this period.</td></tr>'}</table>
 ${compact?'':`<button class="btn s o" style="margin-top:8px" onclick="csv('Daily_production_cost',['Date','Qty made','Materials','Direct costs','Fixed share','Total cost','Cost per unit','Avg selling price'],${esc(JSON.stringify(rows.map(r=>[r.d,r.qty,r2(r.mat),r2(r.direct),r2(r.over),r2(r.tot),r.pu==null?'':r2(r.pu),r.sp==null?'':r2(r.sp)])))})">⬇ Excel (CSV)</button>`}</div>`}
R.production=()=>{if(D&&D.kind==='production')return prodForm();const rows=[...S.production].reverse();const tb=head('Production','<button class="btn" onclick="newProduction()">+ Record production</button>')+tabs('prd',[['runs','Runs & daily cost'],['cost','Cost analysis'],['what','What-if prices']]);if(TAB.prd==='cost')return tb+prodCostTab();if(TAB.prd==='what')return tb+whatIfTab();
 return tb+`<div class="card mut">Record each cooking/packing run here. Finished stock is added as a new batch with its expiry date, and raw materials used are taken out of stock.</div>${dailyCard(TAB.pd||14)}<div class="card scroll"><h2>Production runs</h2><table><tr><th>Entry</th><th>Date</th><th>Product</th><th class="n">Qty made</th><th>Batch</th><th>Expiry</th><th>Materials used</th><th>Workers</th><th class="n">Material cost/unit</th><th class="n">Lot cost/unit</th><th></th></tr>

function estMat(){const simB={...stock().b};let c=0;for(const x of D.inputs)if(x.itemId&&+x.qty>0)for(const a of allocate(x.itemId,+x.qty,simB)){const b=byId(S.batches,a.batchId);c+=a.qty*((b&&b.cost)||itemCost(x.itemId))}return c}

R.demand=()=>{const t=today(),st=stock();const q30=itemQtySold(addDays(t,-29),t);const pend={};for(const o of S.orders)for(const l of orderProgress(o))pend[l.itemId]=(pend[l.itemId]||0)+l.pending;
 const q7=itemQtySold(addDays(t,-6),t),q28=itemQtySold(addDays(t,-27),t);const rows=S.items.filter(i=>i.type==='Finished').map(it=>{const av=available(it.id),dem=pend[it.id]||0,rate=0.6*(q7[it.id]||0)/7+0.4*(q28[it.id]||0)/28,need14=Math.ceil(rate*(+(it.leadDays)||3)+rate*9);const short=Math.max(0,dem-av);const suggest=Math.max(0,Math.ceil(dem+need14+(+it.reorder||0)-av));
  return{it,av,dem,rate,short,suggest,cover:rate?Math.floor(Math.max(0,av-dem)/rate):null}}).sort((a,b)=>b.short-a.short||b.suggest-a.suggest);
 const raw=S.items.filter(i=>i.type!=='Finished').map(it=>({it,av:available(it.id),used:-S.moves.filter(m=>m.itemId===it.id&&m.type==='consumed'&&m.date>=addDays(t,-29)).reduce((s,m)=>s+m.qty,0)}));

 ${rows.map(r=>`<tr><td>${esc(r.it.name)}</td><td class="n">${qf(r.dem)}</td><td class="n">${qf(r.av)}</td><td class="n">${r.short?`<b class="dn">${qf(r.short)}</b>`:'0'}</td><td class="n">${r2(r.rate)}</td><td class="n">${r.cover===null?'-':r.cover+' days'}</td><td class="n">${r.suggest?`<b>${qf(r.suggest)} ${esc(r.it.unit)}</b>`:'<span class="up">enough</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">No finished products.</td></tr>'}</table></div>
 <div class="card scroll"><h2>Materials & supplies</h2><table><tr><th>Item</th><th class="n">Good stock</th><th class="n">Used last 30 days</th><th class="n">Lasts</th><th class="n">Reorder level</th></tr>${raw.map(r=>`<tr><td>${esc(r.it.name)}</td><td class="n">${qf(r.av)} ${esc(r.it.unit)}</td><td class="n">${qf(r.used)}</td><td class="n">${r.used?Math.floor(r.av/(r.used/30))+' days':'-'}</td><td class="n">${r.av<=(+r.it.reorder||0)?`<b class="dn">${qf(r.it.reorder)}</b>`:qf(r.it.reorder)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">None.</td></tr>'}</table></div>`};

let REP={from:today().slice(0,8)+'01',to:today()};let RD={};
function setMonth(v){if(!v)return;const [y,m]=v.split('-').map(Number);REP.from=v+'-01';REP.to=ymd(new Date(y,m,0));render()}
const inP=d=>d>=REP.from&&d<=REP.to;
function rtable(key,title,h,rows,note){RD[key]={h,rows,title};return `<div class="card"><div class="row"><h2 style="margin:0">${esc(title)}</h2><span class="mut">${rows.length} row(s)</span><span class="sp"></span><button class="btn s o" onclick="dlRep('${key}')">⬇ Excel (CSV)</button></div>${note?`<div class="mut" style="font-size:13px">${note}</div>`:''}<div class="scroll" style="margin-top:6px"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>typeof c==='number'?`<td class="n">${c.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})}</td>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mut">Nothing in this period.</td></tr>`}</table></div></div>`}
function dlRep(k){const d=RD[k];csv(d.title+'_'+REP.from+'_to_'+REP.to,d.h,d.rows)}
function dlAll(keys,name){const parts=keys.filter(k=>RD[k]).map(k=>csvText([RD[k].title],[])+'\r\n'+csvText(RD[k].h,RD[k].rows));download(name+'_'+REP.from+'_to_'+REP.to+'.csv','\ufeff'+parts.join('\r\n\r\n'),'text/csv;charset=utf-8')}
function byRate(doc){const m={};for(const l of doc.lines){const k=l.gst;m[k]=m[k]||{rate:k,taxable:0,igst:0,cgst:0,sgst:0};m[k].taxable+=l.taxable;m[k].igst+=l.igst;m[k].cgst+=l.cgst;m[k].sgst+=l.sgst}return Object.values(m).map(x=>({...x,taxable:r2(x.taxable),igst:r2(x.igst),cgst:r2(x.cgst),sgst:r2(x.sgst)}))}
function gstData(){const biz=S.settings.state,lim=+S.settings.b2clLimit||100000;
 const sales=S.sales.filter(s=>!s.cancelled&&inP(s.date)),cns=S.salesReturns.filter(r=>!r.cancelled&&inP(r.date));
 const purch=S.purchases.filter(p=>!p.cancelled&&inP(p.date)),dns=S.purchaseReturns.filter(r=>!r.cancelled&&inP(r.date));
 const isB2CL=s=>!s.party.gstin&&s.inter&&s.total>lim;
 const b2b=[],b2cl=[],b2cs={},cdnr=[],cdnur=[],hsn={};
 for(const s of sales){for(const x of byRate(s)){if(s.party.gstin)b2b.push([s.party.gstin,s.party.name,s.no,dmy(s.date),s.total,stName(s.pos),'N','Regular B2B',x.rate,x.taxable,x.igst,x.cgst,x.sgst,0]);
  else if(isB2CL(s))b2cl.push([s.no,dmy(s.date),s.total,stName(s.pos),x.rate,x.taxable,x.igst,0]);
  else{const k=s.pos+'|'+x.rate;b2cs[k]=b2cs[k]||{pos:s.pos,rate:x.rate,taxable:0,igst:0,cgst:0,sgst:0};const o=b2cs[k];o.taxable+=x.taxable;o.igst+=x.igst;o.cgst+=x.cgst;o.sgst+=x.sgst}}}
 for(const r of cns){const inv=byId(S.sales,r.invoiceId);for(const x of byRate(r)){if(r.party.gstin)cdnr.push([r.party.gstin,r.party.name,r.no,dmy(r.date),'Credit note',stName(r.pos),'N','Regular B2B',r.total,x.rate,x.taxable,x.igst,x.cgst,x.sgst,r.invoiceNo]);
  else if(inv&&isB2CL(inv))cdnur.push(['B2CL',r.no,dmy(r.date),'Credit note',stName(r.pos),r.total,x.rate,x.taxable,x.igst,r.invoiceNo]);
  else{const k=r.pos+'|'+x.rate;b2cs[k]=b2cs[k]||{pos:r.pos,rate:x.rate,taxable:0,igst:0,cgst:0,sgst:0};const o=b2cs[k];o.taxable-=x.taxable;o.igst-=x.igst;o.cgst-=x.cgst;o.sgst-=x.sgst}}}
 const addH=(doc,sign)=>{const typ=doc.party.gstin?'B2B':'B2C';for(const l of doc.lines){const k=typ+'|'+l.hsn+'|'+l.unit+'|'+l.gst;hsn[k]=hsn[k]||{typ,hsn:l.hsn,desc:l.name,uqc:l.unit,rate:l.gst,qty:0,val:0,taxable:0,igst:0,cgst:0,sgst:0};const h=hsn[k];h.qty+=sign*l.qty;h.val+=sign*l.total;h.taxable+=sign*l.taxable;h.igst+=sign*l.igst;h.cgst+=sign*l.cgst;h.sgst+=sign*l.sgst}};
 sales.forEach(s=>addH(s,1));cns.forEach(r=>addH(r,-1));
 const nsort=(a,b)=>a.no.localeCompare(b.no,'en',{numeric:true});const allInv=S.sales.filter(s=>inP(s.date)).sort(nsort),allCn=S.salesReturns.filter(r=>inP(r.date)).sort(nsort);
 const docs=[];if(allInv.length)docs.push(['Invoices for outward supply',allInv[0].no,allInv[allInv.length-1].no,allInv.length,allInv.filter(s=>s.cancelled).length,allInv.length-allInv.filter(s=>s.cancelled).length]);
 if(allCn.length)docs.push(['Credit notes',allCn[0].no,allCn[allCn.length-1].no,allCn.length,allCn.filter(s=>s.cancelled).length,allCn.length-allCn.filter(s=>s.cancelled).length]);
 // 3B
 const T=(arr,f)=>r2(arr.reduce((s,d)=>s+d.lines.filter(f).reduce((a,l)=>a+0,0),0));
 const agg=(arr,f)=>{const o={taxable:0,igst:0,cgst:0,sgst:0};for(const d of arr)for(const l of d.lines)if(f(l)){o.taxable+=l.taxable;o.igst+=l.igst;o.cgst+=l.cgst;o.sgst+=l.sgst}for(const k in o)o[k]=r2(o[k]);return o};
 const minus=(a,b)=>{const o={};for(const k in a)o[k]=r2(a[k]-b[k]);return o};

function setLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,420/img.width,160/img.height);const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.settings.logo=c.toDataURL('image/png');commit('Logo saved')};img.src=r.result};r.readAsDataURL(f)}
function backupNow(){S.lastBackup=new Date().toISOString();persist();download('GingerBooks-backup-'+today()+'.json',JSON.stringify(S),'application/json');render()}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!d.sales)throw 0;if(!confirm('Replace ALL current data with this backup?'))return;S=Object.assign(blank(),d);commit('Backup restored')}catch(e){alert('That file is not a GingerBooks backup.')}};r.readAsText(file)}

 if(!confirm(`Start fresh?\n\nThis removes ${n} entries (invoices, purchases, production, stock, payments, expenses, payroll), all attachments and the change log${syncOn()?', on this device AND in the cloud':''}.\n\nProducts, customers, suppliers, vendors, workers, users and settings are kept. Invoice numbers restart at 0001.\n\nA backup file will be downloaded first.`))return;
 backupNow();if(prompt('A backup file "GingerBooks-backup-'+today()+'.json" has been downloaded. Keep it safe.\n\nTo continue, type START FRESH in capital letters.')!=='START FRESH'){toast('Cancelled. Nothing was removed.');return}
 const files=(S.attachments||[]).filter(a=>a.kind==='file');let tok=null;if(syncOn()&&files.some(a=>a.cloud)){try{tok=await syToken()}catch(e){}}
 for(const a of files){if(a.cloud&&tok)fetch(stURL(a),{method:'DELETE',headers:{apikey:SY.cfg.key,Authorization:'Bearer '+tok}}).catch(()=>{});try{const db=await idb();db.transaction(STORE,'readwrite').objectStore(STORE).delete('file:'+a.id)}catch(e){}}
 for(const k of['batches','moves','purchases','sales','salesReturns','purchaseReturns','orders','production','adjustments','receipts','expenses','bankTxns','attachments','payroll','audit'])S[k]=[];
 S.counters={};S.lastBackup=new Date().toISOString();audit('Settings','All entries','Started fresh after testing',[['Entries removed','',String(n)]],'Testing finished');D=null;PAGE='dash';commit('Started fresh. Products, customers and users are kept.')}
async function eraseAll(){if(!isAdmin())return alert('Only an Admin can do this.');if(!confirm('Erase EVERYTHING, including products, customers, workers, users and settings'+(syncOn()?', on this device and in the cloud':'')+'?\n\nA backup file will be downloaded first.'))return;backupNow();if(prompt('Type ERASE to delete all data')!=='ERASE'){toast('Cancelled. Nothing was removed.');return}
 const files=(S.attachments||[]).filter(a=>a.kind==='file');let tok=null;if(syncOn()&&files.some(a=>a.cloud)){try{tok=await syToken()}catch(e){}}for(const a of files){if(a.cloud&&tok)fetch(stURL(a),{method:'DELETE',headers:{apikey:SY.cfg.key,Authorization:'Bearer '+tok}}).catch(()=>{});try{const db=await idb();db.transaction(STORE,'readwrite').objectStore(STORE).delete('file:'+a.id)}catch(e){}}
 S=blank();LK.cur=null;D=null;PAGE='dash';commit('All data erased')}

/* ================= MONEY: margins, payments, bank, expenses, profit ================= */
const PAYMODES=['Cash','UPI','Cheque','Demand draft','NEFT/RTGS/IMPS','Card','Credit (to be paid)'];
const RMODES=PAYMODES.filter(m=>!/^Credit/.test(m));
function unitCostNow(itemId){const st=stock(),t=today();let q=0,v=0;for(const b of S.batches)if(b.itemId===itemId&&(!b.exp||b.exp>=t)){const bq=st.b[b.id]||0;if(bq>0&&b.cost){q+=bq;v+=bq*b.cost}}return q?r2(v/q):itemCost(itemId)}
function lineMargin(l){if(!l.itemId||!(+l.rate))return null;const c=unitCostNow(l.itemId);if(!c)return null;const net=l.rate*(1-(+l.disc||0)/100);return r2((net-c)/c*100)}
function marginBox(ls){let rev=0,cost=0;for(const l of ls){if(!l.itemId)continue;rev+=l.taxable||0;cost+=(+l.qty||0)*unitCostNow(l.itemId)}if(!rev)return '';const p=rev-cost;
 return `<div class="tot mut" style="font-size:13px;margin-top:6px"><div><span>Your cost (not printed)</span><span>${money(cost)}</span></div><div><span>Profit on this invoice</span><b class="${p>=0?'up':'dn'}">${money(p)}</b></div><div><span>Margin on sale (profit ÷ sale)</span><span>${r2(p/rev*100)}%</span></div><div><span>Markup on cost (profit ÷ cost)</span><span>${cost?r2(p/cost*100)+'%':'-'}</span></div><div style="display:block;font-size:12px;line-height:1.35;padding-top:4px">Cost = material cost of the goods: the average cost of the batches in stock, worked out from production runs and purchases. The cost typed in Products is used only when no batch cost is known. Changing the price in Products changes new invoice lines only; the margin follows the rate on this invoice.</div></div>`}
/* receipts */
function postReceipt(d){const id=uid();const cheque=/Cheque|Demand/.test(d.mode);
 const r={id,no:nextNo('RCP',d.date),date:d.date,customerId:d.customerId||'',partyName:d.partyName||((byId(S.customers,d.customerId)||{}).name)||'Cash customer',mode:d.mode,ref:d.ref||'',bank:d.bank||'',amount:r2(d.amount),allocs:[],status:cheque&&!d.bankTxnId?'Awaiting clearance':'Received',bankTxnId:d.bankTxnId||'',auto:!!d.auto,notes:d.notes||'',cancelled:false};
 if(d.allocs)r.allocs=d.allocs.filter(a=>a.amt>0).map(a=>({saleId:a.saleId,amt:r2(a.amt)}));else{let rem=r.amount;for(const s of openInvoices(r.customerId)){if(rem<=0)break;const amt=Math.min(rem,outstanding(s));if(amt>0){r.allocs.push({saleId:s.id,amt:r2(amt)});rem=r2(rem-amt)}}}
 S.receipts.push(r);if(d.bankTxnId){const t=byId(S.bankTxns,d.bankTxnId);if(t){t.status='matched';t.link={type:'receipt',id}}}return r}
const liveRcp=()=>S.receipts.filter(r=>!r.cancelled&&r.status!=='Bounced');
function paidOn(saleId){return r2(liveRcp().reduce((a,r)=>a+r.allocs.filter(x=>x.saleId===saleId).reduce((b,x)=>b+x.amt,0),0))}
function outstanding(s){if(s.cancelled)return 0;const cn=S.salesReturns.filter(r=>!r.cancelled&&r.invoiceId===s.id).reduce((a,r)=>a+r.total,0);return Math.max(0,r2(s.total-cn-paidOn(s.id)))}
function openInvoices(custId){return S.sales.filter(s=>!s.cancelled&&(custId===undefined||s.customerId===custId)&&outstanding(s)>0.009).sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no))}
function totalDues(){return r2(openInvoices().reduce((a,s)=>a+outstanding(s),0))}
function pendingCheques(){return S.receipts.filter(r=>!r.cancelled&&r.status==='Awaiting clearance')}
function unallocated(r){return r2(r.amount-r.allocs.reduce((a,x)=>a+x.amt,0))}
function rcpsOn(saleId){return liveRcp().filter(r=>r.allocs.some(x=>x.saleId===saleId)).map(r=>({r,amt:r2(r.allocs.filter(x=>x.saleId===saleId).reduce((a,x)=>a+x.amt,0))})).sort((a,b)=>a.r.date.localeCompare(b.r.date))}
function payPill(s){if(s.cancelled)return pill('Cancelled','grey');const bal=outstanding(s),pd=paidOn(s.id);if(bal<=0.009)return pd>0.009?pill('Fully paid','green'):pill('Settled by return','grey');if(pd>0.009)return pill('Part paid '+Math.min(99,Math.floor(pd/(pd+bal)*100))+'% · '+money0(bal)+' due','amber');return pill('Unpaid 0%','red')}
function instList(s){const L=rcpsOn(s.id);return L.length?`<div class="mut" style="font-size:12px;line-height:1.35">${L.map((x,i)=>`${L.length>1?(i+1)+'. ':''}${dmy(x.r.date)} · ${esc(x.r.mode)} · ${f2(x.amt)}${x.r.status==='Awaiting clearance'?' (not cleared)':''}`).join('<br>')}</div>`:''}
function syncAlloc(){if(D.auto)return;const k=Object.keys(D.alloc).filter(k=>D.alloc[k]>0);if(k.length===1){const s=byId(S.sales,k[0]);if(s)D.alloc[k[0]]=r2(Math.min(outstanding(s),D.amount||0))}}
function moneyAlerts(out){const t=today();for(const r of pendingCheques()){const d=Math.floor((new Date(t)-new Date(r.date))/864e5);if(d>=4)out.push({lvl:'amber',type:'Cheque not cleared',text:`${r.mode} ${r.ref} from ${r.partyName} for ${money0(r.amount)} received ${d} days ago is not yet seen in the bank.`,btn:['Payments',"TAB.pay='rcp';go('payments')"]})}
 for(const s of openInvoices()){const c=byId(S.customers,s.customerId);const days=(c&&+c.creditDays)||30;const age=Math.floor((new Date(t)-new Date(s.date))/864e5);if(age>days)out.push({lvl:'amber',type:'Payment overdue',text:`${s.no} · ${s.party.name}: ${money0(outstanding(s))} unpaid for ${age} days.`,btn:['Record payment',`newReceipt('${s.customerId}')`]})}
 const unm=S.bankTxns.filter(x=>x.status==='unmatched').length;if(unm)out.push({lvl:'grey',type:'Bank entries',text:`${unm} bank statement line(s) not yet matched.`,btn:['Review',"go('bank')"]})}

 if(tab==='rcp')return top+`<div class="card scroll"><input placeholder="Search…" oninput="filt(this,'tR')" style="max-width:420px;margin-bottom:8px"><table id="tR"><tr><th>Receipt</th><th>Date</th><th>From</th><th>Mode</th><th>Reference</th><th class="n">Amount</th><th>Against</th><th>Status</th><th></th></tr>${[...S.receipts].reverse().map(r=>`<tr><td>${esc(r.no)}</td><td>${dmy(r.date)}</td><td>${esc(r.partyName)}</td><td>${esc(r.mode)}</td><td>${esc(r.ref)}${r.bank?' · '+esc(r.bank):''}</td><td class="n"><b>${f2(r.amount)}</b></td><td>${r.allocs.map(a=>{const sl=byId(S.sales,a.saleId);return esc((sl||{}).no)+' ('+f2(a.amt)+')'+(sl&&!r.cancelled?' '+payPill(sl):'')}).join('<br>')}${unallocated(r)>0.009?`<div class="mut">Advance: ${f2(unallocated(r))}</div>`:''}</td>
  <td>${r.cancelled?pill('Cancelled','grey'):r.status==='Bounced'?pill('Bounced','red'):r.status==='Awaiting clearance'?pill('Awaiting clearance','amber'):pill(r.bankTxnId?'In bank ✓':'Received','green')}</td>
  <td style="white-space:nowrap">${!r.cancelled&&r.status==='Awaiting clearance'?`<button class="btn s" onclick="setRcp('${r.id}','Received')">Cleared</button><button class="btn s o" onclick="setRcp('${r.id}','Bounced')">Bounced</button>`:''}${attBtn('receipt',r.id)}${r.cancelled?'':`<button class="btn s o" onclick="editQuick('receipts','${r.id}')">Edit</button><button class="btn s o" onclick="cancelRcp('${r.id}')">Cancel</button>`}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">No payments recorded.</td></tr>'}</table></div>`;
 const bal={};for(const s of S.sales.filter(s=>!s.cancelled)){const k=s.customerId||'_walk';bal[k]=bal[k]||{name:s.customerId?s.party.name:'Walk-in customers',billed:0,ret:0,paid:0};bal[k].billed+=s.total}
 for(const r of S.salesReturns.filter(r=>!r.cancelled)){const s=byId(S.sales,r.invoiceId);const k=(s&&s.customerId)||'_walk';if(bal[k])bal[k].ret+=r.total}
 for(const r of liveRcp()){const k=r.customerId||'_walk';bal[k]=bal[k]||{name:r.partyName,billed:0,ret:0,paid:0};bal[k].paid+=r.amount}
 return top+`<div class="card scroll"><table><tr><th>Customer</th><th class="n">Billed</th><th class="n">Returns</th><th class="n">Received</th><th class="n">Balance</th></tr>${Object.values(bal).sort((a,b)=>(b.billed-b.ret-b.paid)-(a.billed-a.ret-a.paid)).map(b=>{const x=r2(b.billed-b.ret-b.paid);return `<tr><td>${esc(b.name)}</td><td class="n">${f2(b.billed)}</td><td class="n">${f2(b.ret)}</td><td class="n">${f2(b.paid)}</td><td class="n"><b class="${x>0?'dn':''}">${f2(x)}</b>${x<0?' <span class="mut">advance</span>':''}</td></tr>`}).join('')}</table></div>`};
function newReceipt(custId,saleId,pre){PAGE='payments';custId=custId||'';D={kind:'rcp',date:today(),customerId:custId,partyName:'',mode:'UPI',ref:'',bank:'',amount:0,auto:true,alloc:{},bankTxnId:'',...(pre||{})};

/* ================= INVOICE NUMBERS ================= */
const invPrefix=()=>((S.settings.invPrefix||'INV').trim().replace(/\/+$/,'')||'INV');
const invKey=d=>invPrefix()+'/'+fy(d);
/* invoice number layout: a pattern of parts in any order. {P} prefix, {N} serial, {N4} serial as 0001, {FY} 2026-27 */
const INV_LAYOUTS=[['{P}{N}/{FY}','Prefix+serial / year'],['{P}/{N}/{FY}','Prefix / serial / year'],['{P}/{FY}/{N4}','Prefix / year / serial'],['{FY}/{P}{N}','Year / prefix+serial'],['{N}/{FY}','Serial / year (no prefix)'],['{P}-{N}/{FY}','Prefix-serial / year']];
const invFmt=()=>{const f=S.settings.invFmt;return !f||f==='PFS'?'{P}/{FY}/{N4}':f==='PSF'?'{P}{N}/{FY}':f};
function fmtInv(d,n){return invFmt().replace(/\{P\}/g,invPrefix()).replace(/\{FY\}/g,fy(d)).replace(/\{N4\}/g,String(n).padStart(4,'0')).replace(/\{N\}/g,String(n))}
function parseInv(no,d){const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('^'+invFmt().split(/(\{P\}|\{FY\}|\{N4\}|\{N\})/).map(t=>t==='{P}'?esc2(invPrefix()):t==='{FY}'?esc2(fy(d)):t==='{N}'||t==='{N4}'?'(\\d+)':esc2(t)).join('')+'$','i');const m=no.trim().match(re);return m?+m[1]:null}
function nextInv(d){const k=invKey(d);S.counters[k]=(S.counters[k]||0)+1;return fmtInv(d,S.counters[k])}
const nextInvNo=d=>fmtInv(d,(S.counters[invKey(d)]||0)+1);
function gstNoOK(no){return no.length<=16&&/^[A-Za-z0-9\/-]+$/.test(no)}
function invNoSection(){const t=today(),k=invKey(t);return `<div class="card"><h2>Invoice numbers</h2>
 <div class="mut" style="font-size:13.5px;margin-bottom:8px">Invoice numbers include the financial year and the serial starts again at 1 on 1 April every year automatically, for example <b>${esc(fmtInv(t,1))}</b>, then <b>${esc(fmtInv(addDays(fyStart(t),366),1))}</b> from next April. If you are moving to GingerBooks in the middle of a year, enter your old bills with <i>Old bill</i> on the invoice page, or just set the next number below.</div>
 <div class="f"><div><label>Order of the parts</label><select id="nxFmt" data-keep="1" onchange="document.getElementById('nxCus').value=this.value==='custom'?document.getElementById('nxCus').value:this.value">${INV_LAYOUTS.map(([v,l])=>opt(v,l+'  e.g. '+v.replace(/\{P\}/g,'A').replace(/\{FY\}/g,fy(t)).replace(/\{N4\}/g,'0207').replace(/\{N\}/g,'207'),INV_LAYOUTS.some(x=>x[0]===invFmt())?invFmt():'custom')).join('')}${opt('custom','My own pattern (type it on the right)',INV_LAYOUTS.some(x=>x[0]===invFmt())?invFmt():'custom')}</select></div><div><label>Pattern</label><input id="nxCus" value="${esc(invFmt())}"><div class="mut" style="font-size:12px">{P} prefix · {N} serial · {N4} serial as 0001 · {FY} year. Put the parts in any order, with - or / between them.</div></div><div><label>Prefix (letters, may end with - )</label><input id="nxPre" value="${esc(invPrefix())}"></div><div><label>Next invoice number for ${fy(t)}</label><input id="nxInv" type="number" min="1" value="${(S.counters[k]||0)+1}"></div></div>
 <button class="btn s" onclick="setNextInv()">Save numbering</button> <span class="mut">The next invoice will be <b>${esc(nextInvNo(t))}</b>.</span>${gstNoOK(nextInvNo(t))?'':'<div class="dn" style="font-size:13px;margin-top:4px">GST rules allow at most 16 characters, using only letters, numbers, - and /. Shorten the prefix.</div>'}<div class="mut" style="font-size:12.5px;margin-top:6px">GST rule: a consecutive serial number of up to 16 characters, using letters, numbers, hyphen (-) and slash (/) only. Spaces are not allowed, so "A 207 / 2026-27" is written A207/2026-27.</div></div>`}
function setNextInv(){const pre=(document.getElementById('nxPre').value||'').trim().replace(/\/+$/,'').replace(/\s+/g,'').replace(/[^A-Za-z0-9\/-]/g,'');const fmt=(document.getElementById('nxCus').value||'').trim().replace(/\s+/g,'');if(!/\{N4?\}/.test(fmt)||!fmt.includes('{FY}'))return toast('The pattern needs {N} (or {N4}) and {FY}');if(fmt.includes('{P}')&&!pre)return toast('Enter a prefix');const n=Math.floor(+document.getElementById('nxInv').value);if(!(n>=1))return toast('Enter the next number (1 or more)');
 const oldPre=invPrefix(),oldFmt=invFmt(),oldKey=invKey(today()),oldN=(S.counters[oldKey]||0)+1;S.settings.invPrefix=pre;S.settings.invFmt=fmt;const k=invKey(today());
 if(!gstNoOK(nextInvNo(today()))&&!confirm(`${nextInvNo(today())} is longer than 16 characters or has characters GST does not allow. Save anyway?`)){S.settings.invPrefix=oldPre;S.settings.invFmt=oldFmt;return}
 const clash=S.sales.filter(s=>{const m=parseInv(s.no,today());return m!=null&&m>=n}).map(s=>s.no);if(clash.length&&!confirm(`These invoice numbers are already used: ${clash.slice(0,5).join(', ')}${clash.length>5?'…':''}\n\nStarting at ${n} would repeat numbers. Continue anyway?`)){S.settings.invPrefix=oldPre;S.settings.invFmt=oldFmt;return}
 S.counters[k]=n-1;audit('Settings','Invoice numbers','Numbering changed',diffOf({p:oldPre,f:oldFmt,n:oldN},{p:pre,f:fmt,n},[['p','Prefix'],['f','Layout'],['n','Next number '+fy(today())]]),'');commit('Next invoice: '+nextInvNo(today()))}

/* ================= RECURRING / PAST EXPENSES ================= */
const FREQ=[['','Just once'],['D','Every day'],['M1','Every month'],['M2','Every 2 months (bi-monthly)'],['M3','Every 3 months (quarterly)'],['M6','Every 6 months (half-yearly)'],['M12','Every year']];
function recurDates(start,freq,until){const out=[];if(!freq||!until||until<start)return [start];if(freq==='D'){for(let d=start;d<=until&&out.length<4000;d=addDays(d,1))out.push(d);return out}

function matPrice(itemId){const ls=[];for(const p of S.purchases)if(!p.cancelled)for(const l of p.lines)if(l.itemId===itemId)ls.push({d:p.date,r:+l.rate});ls.sort((a,b)=>a.d.localeCompare(b.d));const last=ls[ls.length-1];
 const prev=ls.slice(0,-1).filter(x=>x.d>=addDays(last?last.d:today(),-180));const avg=prev.length?prev.reduce((a,x)=>a+x.r,0)/prev.length:null;
 if(last)return{now:last.r,date:last.d,prevAvg:avg};const bs=S.batches.filter(b=>b.itemId===itemId&&b.cost);if(bs.length)return{now:bs[bs.length-1].cost,date:'',prevAvg:null};return{now:itemCost(itemId),date:'',prevAvg:null}}
function prodAgg(itemId,a,b){const r={runs:0,qty:0,mat:0,labour:0,elec:0,fuel:0,other:0,inputs:{}};for(const p of S.production){if(p.cancelled||p.itemId!==itemId||p.date<a||p.date>b)continue;r.runs++;r.qty+=p.qty;r.mat+=p.matCost!=null?p.matCost:p.unitCost*p.qty;const c=p.costs||{};r.labour+=c.labour||0;r.elec+=c.elec||0;r.fuel+=c.fuel||0;r.other+=c.other||0;
  for(const x of p.inputs||[]){const q=r.inputs[x.itemId]=r.inputs[x.itemId]||{qty:0,cost:0};q.qty+=x.qty;for(const al of x.alloc||[]){const bt=byId(S.batches,al.batchId);q.cost+=al.qty*((bt&&bt.cost)||itemCost(x.itemId))}}}
 r.tot=r.mat+r.labour+r.elec+r.fuel+r.other;r.pu=r.qty?r.tot/r.qty:null;return r}

function attDate(a){const d=ATTDOC[a.t];const x=d&&byId(S[d[0]]||[],a.ref);return (x&&x.date)||new Date(a.at||Date.now()).toISOString().slice(0,10)}
function archFYs(){const s=new Set();for(const a of S.attachments||[])if(a.kind==='file'&&!a.deleted)s.add(fy(attDate(a)));return [...s].sort()}
function archInfo(f){const L=(S.attachments||[]).filter(a=>a.kind==='file'&&!a.deleted&&!a.archived&&fy(attDate(a))===f);return{L,n:L.length,mb:L.reduce((x,a)=>x+(a.size||0),0)/1048576}}
function archiveSection(){const all=(S.attachments||[]).filter(a=>a.kind==='file'&&!a.deleted&&!a.archived);const used=all.filter(a=>a.cloud).reduce((x,a)=>x+(a.size||0),0)/1048576;const fys=archFYs();const cur=fy(today());
 return `<div class="card"><h2>Archive old years (free up cloud space)</h2><div class="mut" style="font-size:13.5px;margin-bottom:8px">The free cloud gives 1 GB for attached bills and photos. They use about <b>${r2(used)} MB</b> now. Entries themselves (invoices, expenses…) take very little space and stay in the app, so reports, GST and balances keep working. After a year's audit, archive that year's attachments: they are saved into one file on this computer, then removed from the cloud.</div>
 <table><tr><th>Financial year</th><th class="n">Files</th><th class="n">Size</th><th></th></tr>${fys.map(f=>{const i=archInfo(f);const arc=(S.attachments||[]).filter(a=>a.archived&&fy(attDate(a))===f).length;return `<tr><td>${f}${f===cur?' <span class="mut">(current)</span>':''}</td><td class="n">${i.n}${arc?` <span class="mut">+ ${arc} archived</span>`:''}</td><td class="n">${r2(i.mb)} MB</td><td>${i.n&&f!==cur?`<button class="btn s" onclick="archiveYear('${f}')">Archive ${f}</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="4" class="mut">No attachments yet.</td></tr>'}</table>
 <div class="row" style="margin-top:8px"><label class="btn o" style="margin:0">📂 Open an archive file<input type="file" accept=".gbarchive,.json" style="display:none" onchange="openArchive(this.files[0])"></label><span class="mut" style="font-size:12.5px">Keep archive files in C:\\GingerCan\\Backups and on a pen drive or Google Drive.</span></div></div>`}
async function archiveYear(f){const {L,n,mb}=archInfo(f);if(!n)return;if(!confirm(`Archive ${n} attached files (${r2(mb)} MB) from ${f}?\n\n1. They are downloaded into one archive file on this computer.\n2. Then they are removed from the cloud and from this browser.\n\nThe entries stay. To view an archived bill later, open the archive file in Settings.`))return;
 toast('Collecting files… keep this page open.',60000);const parts=[],meta=[];let miss=0;
 for(const a of L){const b=await attBlob(a,true);if(!b){miss++;continue}const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.readAsDataURL(b)});meta.push(a.id);parts.push(JSON.stringify({meta:{...a,doc:attTitle(a.t,a.ref),date:attDate(a)},data:b64}))}
 if(miss&&!confirm(`${miss} file(s) could not be fetched (not on this device and not in the cloud). Archive the other ${meta.length}?`)){toast('Archive cancelled');return}
 const name=`GingerBooks-archive-${f}-${today()}.gbarchive`;const head=JSON.stringify({gingerbooksArchive:1,fy:f,business:S.settings.name||'',created:new Date().toISOString(),count:meta.length}).slice(0,-1)+',"files":[';
 const blob=new Blob([head,...parts.flatMap((p,i)=>i?[',',p]:[p]),']}'],{type:'application/json'});const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
 if(!confirm(`The archive file "${name}" (${r2(blob.size/1048576)} MB) has been downloaded.\n\nCheck that it is in your Downloads folder, then press OK to remove these ${meta.length} files from the cloud and this browser. Press Cancel to keep them for now.`)){toast('Files kept. You can archive again later.');return}
 const tok=syncOn()?await syToken():null;let rm=0;for(const id of meta){const a=byId(S.attachments,id);if(a.cloud&&tok){try{await fetch(stURL(a),{method:'DELETE',headers:{apikey:SY.cfg.key,Authorization:'Bearer '+tok}});rm++}catch(e){}}try{const db=await idb();db.transaction(STORE,'readwrite').objectStore(STORE).delete('file:'+id)}catch(e){}a.archived={on:today(),file:name};a.cloud=false}
 audit('Archive',f,'Attachments archived',[['Files','',String(meta.length)],['Archive file','',name]],'');commit(`${meta.length} files archived${rm?', '+rm+' removed from the cloud':''}.`)}
let ARCH=null;
async function openArchive(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!d.gingerbooksArchive)throw 0;ARCH={name:file.name,fy:d.fy,files:d.files};archDraw()}catch(e){alert('That file is not a GingerBooks archive.')}}

/* ================= SEARCHABLE, SORTED DROPDOWNS ================= */
/* Every dropdown with more than 7 choices is sorted A to Z (except states, batches and payment modes, which keep their natural order)
   and gets a type-to-search box. The real <select> stays underneath, so all existing code keeps working. */
function cbKeepOrder(s){return !!(s.querySelector('option[value="auto"]')||[...s.options].some(o=>/^\d\d - /.test(o.text))||[...s.options].some(o=>o.text==='Cash')||s.dataset.keep)}
function cbSort(s){const v=s.value,opts=[...s.options];const head=[];while(opts.length&&(opts[0].value===''||/^—/.test(opts[0].text)))head.push(opts.shift());opts.sort((a,b)=>a.text.localeCompare(b.text,'en',{sensitivity:'base',numeric:true}));for(const o of [...head,...opts])s.appendChild(o);s.value=v}
function enhanceSelects(root){for(const s of (root||document).querySelectorAll('select:not([data-cb])')){s.dataset.cb='1';if(s.options.length<=7)continue;if(!cbKeepOrder(s))cbSort(s);cbMake(s)}
 for(const dl of (root||document).querySelectorAll('datalist:not([data-cb])')){dl.dataset.cb='1';const o=[...dl.options].sort((a,b)=>a.value.localeCompare(b.value,'en',{sensitivity:'base'}));for(const x of o)dl.appendChild(x)}}
let CBL=null;
function cbClose(){if(CBL){CBL.remove();CBL=null}}
function cbMake(s){const w=document.createElement('div');w.className='cb';if(s.style.width)w.style.width=s.style.width;s.parentNode.insertBefore(w,s);w.appendChild(s);s.style.display='none';
 const i=document.createElement('input');i.type='text';i.className='cbi';i.autocomplete='off';i.spellcheck=false;i.disabled=s.disabled;i.title='Type to search, or pick from the list';const txt=()=>s.selectedOptions[0]?s.selectedOptions[0].text:'';i.value=txt();i.placeholder=txt()||'Type to search…';w.insertBefore(i,s);
 let act=-1,items=[];
 const draw=q=>{const words=(q||'').toLowerCase().split(/\s+/).filter(Boolean);items=[...s.options].filter(o=>!o.disabled&&words.every(wd=>o.text.toLowerCase().includes(wd)));cbClose();const L=document.createElement('div');L.className='cbl';
  L.innerHTML=items.map((o,k)=>`<div data-k="${k}" class="${o.value===s.value?'sel':''}${k===act?' on':''}">${esc(o.text)}</div>`).join('')||'<div class="mut" style="cursor:default">No match</div>';
  const r=i.getBoundingClientRect(),below=window.innerHeight-r.bottom;L.style.left=Math.max(4,Math.min(r.left,window.innerWidth-Math.max(r.width,240)-4))+'px';L.style.width=Math.max(r.width,240)+'px';
  if(below<200&&r.top>below){L.style.bottom=(window.innerHeight-r.top+2)+'px';L.style.maxHeight=Math.min(300,r.top-8)+'px'}else{L.style.top=(r.bottom+2)+'px';L.style.maxHeight=Math.min(300,below-8)+'px'}
  L.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-k]');if(d)pick(items[+d.dataset.k])});document.body.appendChild(L);CBL=L;const a=L.querySelector('.on')||L.querySelector('.sel');if(a)a.scrollIntoView({block:'nearest'})};
 const pick=o=>{cbClose();if(!o)return;i.value=o.text;if(s.value!==o.value){s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}))}};
 i.addEventListener('focus',()=>{act=-1;i.select();draw('')});
 i.addEventListener('input',()=>{act=0;draw(i.value)});
 i.addEventListener('keydown',e=>{if(!CBL&&(e.key==='ArrowDown'||e.key==='Enter')){draw('');return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=Math.max(0,Math.min(items.length-1,act+(e.key==='ArrowDown'?1:-1)));draw(i.value===txt()?'':i.value)}else if(e.key==='Enter'){e.preventDefault();pick(items[Math.max(0,act)])}else if(e.key==='Escape'){cbClose();i.value=txt();i.blur()}else if(e.key==='Tab'&&CBL&&act>=0)pick(items[act])});
 i.addEventListener('blur',()=>{setTimeout(()=>{if(document.activeElement!==i){cbClose();i.value=txt()}},120)})}
window.addEventListener('scroll',e=>{if(CBL&&!(e.target&&e.target.closest&&e.target.closest('.cbl'))){cbClose();if(document.activeElement&&document.activeElement.classList.contains('cbi'))document.activeElement.blur()}},true);
window.addEventListener('resize',cbClose);

 const rest=S.items.filter(i=>!ids.has(i.id)&&(D.allItems||GOODTYPES.includes(i.type)||i.id===sel)).sort(byTypeName);

async function syRest(method,q,body,extra){const tok=await syToken();const r=await fetch(SY.cfg.url.replace(/\/$/,'')+'/rest/v1/'+q,{method,headers:{apikey:SY.cfg.key,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'return=representation',...(extra||{})},body:body?JSON.stringify(body):undefined});const t=await r.text();if(!r.ok)throw new Error('Cloud error '+r.status+': '+t.slice(0,160));return t?JSON.parse(t):null}
function syState(st,msg){SY.status=st;SY.msg=msg||'';const el=document.getElementById('syncpill');if(el)el.outerHTML=syncPill()}
function syncPill(){if(!syncOn())return '<span id="syncpill"></span>';const m={ok:['☁ Synced','#1e8449'],busy:['☁ Syncing…','#a9c9bd'],dirty:['☁ Waiting to sync','#d68910'],offline:['☁ Offline, will sync','#d68910'],error:['☁ Sync problem','#c0392b'],conflict:['☁ Needs your choice','#c0392b']}[SY.status]||['☁ Sync','#a9c9bd'];return `<a id="syncpill" onclick="go('settings')" title="${esc(SY.msg)}" style="color:${m[1]};font-size:12px;padding:2px 10px 10px;display:block">${m[0]}</a>`}
async function syncPush(){if(!syncOn()||SY.busy)return;if(!navigator.onLine){syState('offline');return}SY.busy=true;syState('busy');
 try{const base=syBase();const data=JSON.parse(JSON.stringify(S));let rows;
  if(base===0){const ex=await syRest('GET','books?select=version&user_id=eq.'+SY.sess.uid);if(ex&&ex.length){SY.busy=false;return syConflict(ex[0].version)}rows=await syRest('POST','books',{user_id:SY.sess.uid,data,version:1,updated_at:new Date().toISOString()})}
  else rows=await syRest('PATCH','books?user_id=eq.'+SY.sess.uid+'&version=eq.'+base,{data,version:base+1,updated_at:new Date().toISOString()});
  if(!rows||!rows.length){const r=await syRest('GET','books?select=version&user_id=eq.'+SY.sess.uid);SY.busy=false;return syConflict(r&&r[0]?r[0].version:0)}
  syBase(rows[0].version);syDirty(false);syState('ok','Last synced '+new Date().toLocaleTimeString('en-IN'))}catch(e){syState(navigator.onLine?'error':'offline',e.message)}SY.busy=false}
async function syncPull(force){if(!syncOn()||SY.busy||!navigator.onLine)return;try{const r=await syRest('GET','books?select=version&user_id=eq.'+SY.sess.uid);if(!r||!r.length){if(syDirty()||force)syncPush();return}
  const rv=r[0].version;if(rv===syBase()){if(syDirty())syncPush();else syState('ok','Up to date');return}
  if(rv>syBase()){if(syDirty())return syConflict(rv);await syTakeCloud()}}catch(e){syState('error',e.message)}}
async function syTakeCloud(){SY.busy=true;syState('busy');try{const r=await syRest('GET','books?select=data,version&user_id=eq.'+SY.sess.uid);if(r&&r[0]){const wasLocked=LK.locked;S=Object.assign(blank(),r[0].data);S.settings=Object.assign(blank().settings,S.settings);syBase(r[0].version);try{await lkCheck()}catch(e){}syDirty(false);await idbPut('state',JSON.stringify(S));D=null;render();syState('ok','Updated from cloud '+new Date().toLocaleTimeString('en-IN'));toast('Updated with the latest entries from the cloud')}}catch(e){syState('error',e.message)}SY.busy=false}
function syConflict(rv){syState('conflict','This device and the cloud both have new changes.');
 const keepCloud=confirm('Entries were made on another device AND on this one since the last sync.\n\nOK = use the CLOUD copy (this device\'s unsynced changes are saved to a backup file first).\nCancel = keep THIS DEVICE\'s copy and overwrite the cloud.');
 if(keepCloud){download('GingerBooks-before-cloud-'+today()+'.json',JSON.stringify(S),'application/json');syTakeCloud()}else{syBase(rv);syncPush()}}
function syncAfterCommit(){if(!syncOn())return;syDirty(true);syState('dirty');clearTimeout(SY.timer);SY.timer=setTimeout(syncPush,2500)}
async function syncSignIn(){const email=document.getElementById('syEmail').value.trim(),pw=document.getElementById('syPw').value;SY.cfg.url=document.getElementById('syUrl').value.trim();SY.cfg.key=document.getElementById('syKey').value.trim();sySave();
 if(!SY.cfg.url||!SY.cfg.key||!email||!pw)return toast('Fill in all four fields');try{sySetSess(await syAuth('token?grant_type=password',{email,password:pw}));toast('Signed in. Syncing…');
  const r=await syRest('GET','books?select=version,updated_at&user_id=eq.'+SY.sess.uid);
  if(r&&r.length){const hasLocal=S.sales.length+S.purchases.length+S.items.length>0;if(!hasLocal||confirm(`The cloud already has books (last saved ${new Date(r[0].updated_at).toLocaleString('en-IN')}).\n\nOK = load the cloud books on this device (this device's current data is downloaded as a backup file first).\nCancel = replace the cloud books with this device's data.`)){if(hasLocal)download('GingerBooks-before-cloud-'+today()+'.json',JSON.stringify(S),'application/json');syBase(0);await syTakeCloud()}else{syBase(r[0].version);syDirty(true);await syncPush()}}
  else{syBase(0);syDirty(true);await syncPush()}render()}catch(e){alert(e.message)}}
function syncSignOut(){if(!confirm('Stop syncing on this device? Data stays on this device.'))return;SY.sess=null;sySave();syBase(0);syDirty(false);render()}

 :`<p class="mut" style="font-size:13.5px">Optional. Sign in with the same email and password on every device (laptop file, website, phone) and they all show the same books. Entries are saved on the device first and sent to the cloud when there is internet.</p>

let ATT=null;const attOf=(t,id)=>(S.attachments||[]).filter(a=>a.t===t&&a.ref===id&&!a.deleted);
function attBtn(t,id){const n=attOf(t,id).length;return `<button class="btn s o" onclick="attOpen('${t}','${id}')" title="Bills, scans, documents and notes">📎${n?' '+n:''}</button>`}
function attTitle(t,id){const d=ATTDOC[t]||[t,t];const x=byId(S[d[0]]||[],id)||{};return d[1]+' '+(x.no||x.name||'')+(x.ym?' · '+ymLbl(x.ym):'')+(x.party&&x.party.name?' · '+x.party.name:x.supplierName?' · '+x.supplierName:x.payee?' · '+x.payee:'')}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function attOpen(t,id){ATT={t,id};attDraw()}

function attDraw(){const m=document.getElementById('modal');if(!ATT){m.style.display='none';return}const list=attOf(ATT.t,ATT.id);
 m.innerHTML=`<div class="mbox"><div class="row" style="align-items:center"><h2 style="margin:0">📎 ${esc(attTitle(ATT.t,ATT.id))}</h2><span class="sp"></span><button class="btn s o" onclick="attClose()">Close ✕</button></div>
 <div class="row" style="margin:10px 0"><label class="btn" style="margin:0;color:#fff">⬆ Add files<input type="file" multiple accept="image/*,application/pdf,.eml,.msg,.txt,.doc,.docx,.xls,.xlsx,.csv" style="display:none" onchange="attAdd(this.files)"></label><label class="btn o" style="margin:0">📷 Take photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="attAdd(this.files)"></label></div>
 <div class="mut" style="font-size:12.5px;margin-bottom:8px">Bills, cheque / DD scans, delivery notes, PDFs, saved emails (.eml or PDF), up to 10 MB each. Photos and scanned bills are made smaller automatically before saving (like WhatsApp, usually 150 to 400 KB), so storage lasts longer. PDFs are kept as they are.${syncOn()?' Files are also kept in the cloud, so your other devices can open them.':' Turn on cloud sync to see files on other devices too.'}</div>
 <div class="f"><div style="grid-column:1/-1"><label>Add a note (footnote, phone call, email text…)</label><textarea id="attNote" rows="2"></textarea></div></div><button class="btn s o" onclick="attAddNote()">Save note</button>
 <div style="margin-top:12px">${list.length?list.slice().reverse().map(a=>`<div class="attrow">${a.kind==='note'?'<div class="attth">📝</div>':a.type.startsWith('image/')?`<img class="attth" id="th_${a.id}" alt="">`:`<div class="attth">${a.type==='application/pdf'?'📄':/\.(eml|msg)$/i.test(a.name)?'✉️':'📁'}</div>`}
  <div style="flex:1;min-width:0">${a.kind==='note'?`<div style="white-space:pre-wrap">${esc(a.note)}</div>`:`<b style="word-break:break-all">${esc(a.name)}</b> <span class="mut">${kb(a.size)}</span>`}<div class="mut" style="font-size:12px">${new Date(a.at).toLocaleString('en-IN')}${a.kind!=='note'&&syncOn()?(a.cloud?' · ☁ in cloud':' · waiting to upload'):''}</div></div>
  ${a.kind==='note'?'':`<button class="btn s o" onclick="attView('${a.id}')">Open</button>`}<button class="btn s o" onclick="attDel('${a.id}')">Delete</button></div>`).join(''):'<div class="mut">Nothing attached yet.</div>'}</div></div>`;
 m.style.display='flex';for(const a of list)if(a.kind!=='note'&&a.type.startsWith('image/'))attBlob(a,true).then(b=>{const el=document.getElementById('th_'+a.id);if(el&&b)el.src=URL.createObjectURL(b)}).catch(()=>{})}
async function shrink(f){if(!/^image\//.test(f.type)||/gif|svg/.test(f.type)||f.size<250000)return f;try{const bm=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));if(b&&b.size>450000)b=(await new Promise(r=>c.toBlob(r,'image/jpeg',.55)))||b;return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}
async function attAdd(files){let n=0;for(let f of files){f=await shrink(f);if(f.size>10485760){toast(f.name+' is larger than 10 MB, not added.',5000);continue}
  const a={id:uid(),t:ATT.t,ref:ATT.id,kind:'file',name:f.name,type:f.type||'application/octet-stream',size:f.size,at:Date.now(),cloud:false};await idbPut('file:'+a.id,f);S.attachments.push(a);n++}
 await persist();attDraw();if(n)toast(n+' file(s) attached');attFlush()}
async function attAddNote(){const t=document.getElementById('attNote').value.trim();if(!t)return;S.attachments.push({id:uid(),t:ATT.t,ref:ATT.id,kind:'note',note:t,at:Date.now()});await persist();attDraw()}
const stURL=a=>SY.cfg.url.replace(/\/$/,'')+'/storage/v1/object/attachments/'+SY.sess.uid+'/'+a.id;
async function attBlob(a,quiet){if(a.archived){if(!quiet)toast('This file was archived on '+dmy(a.archived.on)+' into '+a.archived.file+'. Open that file in Settings → Archive old years.',7000);return null}let b=GM.on?null:await idbGet('file:'+a.id);if(b)return b;if(GM.on&&a.cloud){const r=await fetch(SY.cfg.url.replace(/\/$/,'')+'/storage/v1/object/authenticated/attachments/'+GM.info.owner+'/'+a.id,{headers:{apikey:SY.cfg.key,Authorization:'Bearer '+await gToken()}});if(!r.ok){if(!quiet)toast('Could not open the file ('+r.status+').');return null}return new Blob([await r.blob()],{type:a.type})}if(!a.cloud||!syncOn()){if(!quiet)toast('This file is on another device. Turn on cloud sync to open it here.',5000);return null}
 const r=await fetch(SY.cfg.url.replace(/\/$/,'')+'/storage/v1/object/authenticated/attachments/'+SY.sess.uid+'/'+a.id,{headers:{apikey:SY.cfg.key,Authorization:'Bearer '+await syToken()}});if(!r.ok){if(!quiet)toast('Could not download the file ('+r.status+').');return null}
 b=await r.blob();b=new Blob([b],{type:a.type});await idbPut('file:'+a.id,b);return b}
async function attView(id){const a=byId(S.attachments,id);const w=window.open('','_blank');const b=await attBlob(a);if(!b){if(w)w.close();return}const u=URL.createObjectURL(b);
 if(w&&(a.type.startsWith('image/')||a.type==='application/pdf'||a.type.startsWith('text/')))w.location=u;else{if(w)w.close();const l=document.createElement('a');l.href=u;l.download=a.name;l.click()}}
async function attDel(id){const a=byId(S.attachments,id);if(!confirm('Delete '+(a.kind==='note'?'this note':a.name)+'?'))return;a.deleted=true;try{const db=await idb();db.transaction(STORE,'readwrite').objectStore(STORE).delete('file:'+id)}catch(e){}
 if(a.cloud&&syncOn())fetch(stURL(a),{method:'DELETE',headers:{apikey:SY.cfg.key,Authorization:'Bearer '+await syToken()}}).catch(()=>{});await persist();attDraw()}
let ATTBUSY=false;async function attFlush(){if(GM.on||ATTBUSY||!syncOn()||!navigator.onLine)return;ATTBUSY=true;let ch=false;try{for(const a of S.attachments||[]){if(a.kind!=='file'||a.cloud||a.deleted)continue;const b=await idbGet('file:'+a.id);if(!b)continue;
